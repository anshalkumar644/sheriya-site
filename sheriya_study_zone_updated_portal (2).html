const getYouTubeId = (url) => {

};

const formatTime = (timeInSeconds) => {
    if (isNaN(timeInSeconds)) return "00:00";
    const m = Math.floor(timeInSeconds / 60).toString().padStart(2, '0');
    const s = Math.floor(timeInSeconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
};

// Poster Carousel Component
const PosterCarousel = ({ posters }) => {
    const [currentIndex, setCurrentIndex] = useState(0);
    const [isPaused, setIsPaused] = useState(false);
    const pauseTimeoutRef = useRef(null);
    const touchStartX = useRef(0);

    useEffect(() => {
        if (!posters || posters.length <= 1 || isPaused) return;
        const timer = setInterval(() => {
            setCurrentIndex(prev => (prev + 1) % posters.length);
        }, 3500);
        return () => clearInterval(timer);
    }, [posters, isPaused]);

    useEffect(() => {
        return () => { if (pauseTimeoutRef.current) clearTimeout(pauseTimeoutRef.current); };
    }, []);

    const triggerPause = () => {
        setIsPaused(true);
        if (pauseTimeoutRef.current) clearTimeout(pauseTimeoutRef.current);
        pauseTimeoutRef.current = setTimeout(() => {
            setIsPaused(false);
        }, 10000);
    };

    const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        triggerPause();
    };

    const handleTouchEnd = (e) => {
        const diff = touchStartX.current - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40 && posters.length > 1) {
            if (diff > 0) setCurrentIndex(prev => (prev + 1) % posters.length);
            else setCurrentIndex(prev => (prev - 1 + posters.length) % posters.length);
        }
    };

    if (!posters || posters.length === 0) return null;

    return (
        <div 
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
            onClick={triggerPause}
            className="relative w-full h-36 sm:h-48 md:h-56 rounded-3xl overflow-hidden shadow-soft-card border border-indigo-100 bg-slate-900 select-none group"
        >
            <div 
                className="flex h-full transition-transform duration-500 ease-out"
                style={{ transform: `translateX(-${currentIndex * 100}%)` }}
            >
                {posters.map((poster) => (
                    <div key={poster.id} className="w-full h-full shrink-0 relative">
                        <img src={poster.image} alt={poster.caption || "Banner"} className="w-full h-full object-cover" />
                        {poster.caption && (
                            <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-3 pt-6">
                                <p className="text-white text-xs sm:text-sm font-bold truncate">{poster.caption}</p>
                            </div>
                        )}
                    </div>
                ))}
            </div>

            {isPaused && (
                <div className="absolute top-2.5 right-2.5 bg-black/60 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                    <Pause className="h-3 w-3 text-yellow-300" /> Paused (10s)
                </div>
            )}

            {posters.length > 1 && (
                <>
                    <button 
                        onClick={(e) => { e.stopPropagation(); triggerPause(); setCurrentIndex(prev => (prev - 1 + posters.length) % posters.length); }}
                        className="hidden sm:flex absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white items-center justify-center opacity-0 group-hover:opacity-100 transition"
                    >
                        <ChevronLeft className="h-4 w-4" />
                    </button>
                    <button 
                        onClick={(e) => { e.stopPropagation(); triggerPause(); setCurrentIndex(prev => (prev + 1) % posters.length); }}
                        className="hidden sm:flex absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/70 text-white items-center justify-center opacity-0 group-hover:opacity-100 transition"
                    >
                        <ChevronRight className="h-4 w-4" />
                    </button>
                    <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1.5 z-10">
                        {posters.map((_, idx) => (
                            <button 
                                key={idx} 
                                onClick={(e) => { e.stopPropagation(); triggerPause(); setCurrentIndex(idx); }}
                                className={`h-1.5 rounded-full transition-all ${currentIndex === idx ? 'w-5 bg-yellow-300' : 'w-1.5 bg-white/60'}`}
                            />
                        ))}
                    </div>
                </>
            )}
        </div>
    );
};

// Advertisement Video Player Component
const AdVideoCarousel = ({ ads }) => {
    const [currentIndex, setCurrentIndex] = useState(0);
    const [isMuted, setIsMuted] = useState(true);
    const playerRef = useRef(null);
    const touchStartX = useRef(0);
    const containerId = "ad-yt-player-frame";

    const currentAd = ads && ads.length > 0 ? ads[currentIndex % ads.length] : null;
    const ytId = currentAd ? getYouTubeId(currentAd.link) : null;

    const goToNext = () => {
        if (!ads || ads.length === 0) return;
        setCurrentIndex(prev => (prev + 1) % ads.length);
    };

    const goToPrev = () => {
        if (!ads || ads.length === 0) return;
        setCurrentIndex(prev => (prev - 1 + ads.length) % ads.length);
    };

    useEffect(() => {
        if (!ytId) return;

        const initPlayer = () => {
            if (playerRef.current && playerRef.current.destroy) {
                try { playerRef.current.destroy(); } catch (e) {}
            }
            playerRef.current = new window.YT.Player(containerId, {
                videoId: ytId,
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    iv_load_policy: 3
                },
                events: {
                    onReady: (e) => {
                        if (isMuted) e.target.mute();
                        else e.target.unMute();
                        e.target.playVideo();
                    },
                    onStateChange: (e) => {
                        if (e.data === window.YT.PlayerState.ENDED) {
                            if (ads.length === 1) {
                                e.target.seekTo(0);
                                e.target.playVideo();
                            } else {
                                goToNext();
                            }
                        }
                    }
                }
            });
        };

        if (window.YT && window.YT.Player) {
            initPlayer();
        } else {
            const orig = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
                if (orig) orig();
                initPlayer();
            };
        }

        return () => {
            if (playerRef.current && playerRef.current.destroy) {
                try { playerRef.current.destroy(); } catch (e) {}
            }
        };
    }, [ytId, currentIndex, ads?.length]);

    const toggleMute = (e) => {
        e.stopPropagation();
        if (!playerRef.current) return;
        if (isMuted) {
            playerRef.current.unMute();
            setIsMuted(false);
        } else {
            playerRef.current.mute();
            setIsMuted(true);
        }
    };

    const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
    };

    const handleTouchEnd = (e) => {
        const diff = touchStartX.current - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40 && ads.length > 1) {
            if (diff > 0) goToNext();
            else goToPrev();
        }
    };

    if (!ads || ads.length === 0) return null;

    return (
        <div className="space-y-2.5">
            <div className="flex items-center justify-between px-1">
                <h3 className="font-bubble text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                    <Film className="h-5 w-5 text-rose-500" /> Featured & Updates
                </h3>
                {ads.length > 1 && (
                    <span className="text-[11px] font-bold text-slate-500 bg-white px-2.5 py-0.5 rounded-full border">
                        {currentIndex + 1} / {ads.length} • Swipe for next
                    </span>
                )}
            </div>

            <div 
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
                className="relative rounded-3xl overflow-hidden bg-black shadow-soft-card border border-slate-200 select-none"
            >
                <div className="relative pb-[56.25%] h-0 bg-black">
                    {ytId ? (
                        <div id={containerId} className="absolute inset-0 w-full h-full pointer-events-none"></div>
                    ) : (
                        <div className="absolute inset-0 flex items-center justify-center text-white text-xs font-bold">
                            Invalid Video Link
                        </div>
                    )}
                    <div className="absolute inset-0 z-10"></div>
                </div>

                <div className="absolute top-3 left-3 right-3 z-20 flex items-center justify-between pointer-events-none">
                    <span className="bg-rose-600/90 backdrop-blur-md text-white text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-full shadow">
                        {currentAd?.title || "Featured Video"}
                    </span>
                    <button 
                        onClick={toggleMute}
                        className="pointer-events-auto bg-black/60 hover:bg-black/80 text-white p-2 rounded-full backdrop-blur-md transition border border-white/20"
                        title={isMuted ? "Unmute" : "Mute"}
                    >
                        {isMuted ? <VolumeX className="h-4 w-4 text-rose-400" /> : <Volume2 className="h-4 w-4 text-emerald-400" />}
                    </button>
                </div>

                {ads.length > 1 && (
                    <div className="absolute bottom-3 right-3 z-20 flex items-center gap-2">
                        <button onClick={goToPrev} className="bg-black/60 hover:bg-black/80 text-white p-2 rounded-xl backdrop-blur-md border border-white/10 transition">
                            <ChevronLeft className="h-4 w-4" />
                        </button>
                        <button onClick={goToNext} className="bg-black/60 hover:bg-black/80 text-white px-3 py-1.5 rounded-xl backdrop-blur-md border border-white/10 text-[11px] font-bold flex items-center gap-1 transition">
                            <span>Next</span> <SkipForward className="h-3.5 w-3.5" />
                        </button>
                    </div>
                )}
            </div>
        </div>
    );
};

const CustomVideoPlayer = ({ video, allVideos, onSelectVideo, onBack }) => {
    const ytId = getYouTubeId(video.link);
    const containerId = `yt-player-${video.id}`;
    const playerRef = useRef(null);

    const [isPlaying, setIsPlaying] = useState(true);
    const [isMuted, setIsMuted] = useState(false);
    const [currentTimeSec, setCurrentTimeSec] = useState(0);
    const [durationSec, setDurationSec] = useState(1);
    const [playbackSpeed, setPlaybackSpeed] = useState("1.0x");
    const [showSettings, setShowSettings] = useState(false);
    const [settingsTab, setSettingsTab] = useState("menu");

    useEffect(() => {
        if (!ytId) return;
        const loadYTPlayer = () => {
            playerRef.current = new window.YT.Player(containerId, {
                videoId: ytId,
                playerVars: { autoplay: 1, controls: 0, modestbranding: 1, rel: 0, playsinline: 1, disablekb: 1 },
                events: {
                    onReady: (e) => { setDurationSec(e.target.getDuration()); e.target.playVideo(); },
                    onStateChange: (e) => { setIsPlaying(e.data === window.YT.PlayerState.PLAYING); }
                }
            });
        };
        if (window.YT && window.YT.Player) loadYTPlayer();
        else { const originalReady = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (originalReady) originalReady(); loadYTPlayer(); }; }
        const interval = setInterval(() => { if (playerRef.current && playerRef.current.getCurrentTime) setCurrentTimeSec(playerRef.current.getCurrentTime()); }, 500);
        return () => { clearInterval(interval); if (playerRef.current?.destroy) playerRef.current.destroy(); };
    }, [ytId, containerId]);

    const togglePlay = () => {
        if (!playerRef.current?.getPlayerState) return;
        if (playerRef.current.getPlayerState() === window.YT.PlayerState.PLAYING) playerRef.current.pauseVideo();
        else playerRef.current.playVideo();
    };

    const toggleMute = () => {
        if (!playerRef.current) return;
        if (isMuted) playerRef.current.unMute(); else playerRef.current.mute();
        setIsMuted(!isMuted);
    };

    const handleSeek = (e) => {
        if (!playerRef.current) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const newTime = ((e.clientX - rect.left) / rect.width) * durationSec;
        playerRef.current.seekTo(newTime, true); setCurrentTimeSec(newTime);
    };

    const toggleFullscreen = () => {
        const elem = document.getElementById("custom-video-wrapper");
        if (!elem) return;
        if (!document.fullscreenElement) elem.requestFullscreen?.();
        else document.exitFullscreen?.();
    };

    const handleSpeedSelect = (val, label) => {
        if (playerRef.current) playerRef.current.setPlaybackRate(val);
        setPlaybackSpeed(label); setShowSettings(false);
    };

    const progressPercent = durationSec > 0 ? (currentTimeSec / durationSec) * 100 : 0;

    return (
        <div className="space-y-6">

// ============================================================================
// EIND PERSONAL NOTEBOOK COMPONENT (Multi-page, Blank/Hindi/Graph, Pens, Shapes, Image Crop/Move/Resize, Select)
// ============================================================================
const EindNotebookModal = ({ onClose, studentMobile, studentName, showToast }) => {
    const storageKey = `ssz_eind_notebook_${studentMobile || "guest"}`;

    const createBlankPage = (index = 1) => ({
        id: "pg-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        title: `Page ${index}`,
        pageType: "hindi", // 'blank' | 'hindi' | 'graph'
        elements: [], // { id, kind: 'stroke'|'shape'|'image', ... }
        selected: false
    });

    const [pages, setPages] = useState(() => {
        try {
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
        } catch (e) {}
        return [createBlankPage(1)];
    });

    const [activePageIdx, setActivePageIdx] = useState(0);
    const [tool, setTool] = useState("pen"); // 'select' | 'pen' | 'eraser' | 'rect' | 'circle' | 'line' | 'triangle' | 'text'
    const [penColor, setPenColor] = useState("#1e293b");
    const [penSize, setPenSize] = useState(3);
    const [textSize, setTextSize] = useState(18);
    const [selectedElementId, setSelectedElementId] = useState(null);
    const [editingTextId, setEditingTextId] = useState(null);
    const [isDrawing, setIsDrawing] = useState(false);
    const [currentDraft, setCurrentDraft] = useState(null);
    const [dragAction, setDragAction] = useState(null); // { mode: 'move'|'resize', elId, startX, startY, origX, origY, origW, origH }

    // Image Crop Modal States
    const [cropRawImage, setCropRawImage] = useState(null);
    const [cropRect, setCropRect] = useState({ x: 10, y: 10, w: 80, h: 80 }); // percentages

    const boardRef = useRef(null);
    const fileInputRef = useRef(null);

    const activePage = pages[activePageIdx] || pages[0];

    useEffect(() => {
        try {
            localStorage.setItem(storageKey, JSON.stringify(pages));
        } catch (e) {}
    }, [pages, storageKey]);

    const updateActivePage = (updater) => {
        setPages(prev => prev.map((pg, idx) => idx === activePageIdx ? updater(pg) : pg));
    };

    const handleAddPage = (type = "hindi") => {
        const newPg = {
            ...createBlankPage(pages.length + 1),
            pageType: type
        };
        setPages(prev => [...prev, newPg]);
        setActivePageIdx(pages.length);
        setSelectedElementId(null);
        showToast(`Naya ${type.toUpperCase()} page add ho gaya!`);
    };

    const handleChangePageType = (newType) => {
        updateActivePage(pg => ({ ...pg, pageType: newType }));
    };

    const toggleSelectNotePage = (idx) => {
        setPages(prev => prev.map((pg, i) => i === idx ? { ...pg, selected: !pg.selected } : pg));
    };

    const handleDeleteSelectedPages = () => {
        const remaining = pages.filter(pg => !pg.selected);
        if (remaining.length === 0) {
            setPages([createBlankPage(1)]);
            setActivePageIdx(0);
        } else {
            setPages(remaining);
            setActivePageIdx(0);
        }
        setSelectedElementId(null);
        showToast("Selected notes delete ho gaye!");
    };

    const getBoardCoords = (e) => {
        const rect = boardRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: Math.max(0, Math.min(rect.width, clientX - rect.left)),
            y: Math.max(0, Math.min(rect.height, clientY - rect.top))
        };
    };

    const handleAddTextBox = (x = 60, y = 60, initialText = "") => {
        const newTextEl = {
            id: "txt-" + Date.now(),
            kind: "text",
            text: initialText,
            color: penColor,
            fontSize: textSize,
            x,
            y,
            width: 240
        };
        updateActivePage(pg => ({
            ...pg,
            elements: [...pg.elements, newTextEl]
        }));
        setSelectedElementId(newTextEl.id);
        setEditingTextId(newTextEl.id);
        setTool("select");
    };

    const handleCopySelectedText = () => {
        const selectedEl = activePage.elements.find(el => el.id === selectedElementId && el.kind === "text");
        if (!selectedEl || !selectedEl.text) {
            showToast("Copy karne ke liye pehle koi likha hua text select karein!", "error");
            return;
        }
        const tempArea = document.createElement("textarea");
        tempArea.value = selectedEl.text;
        document.body.appendChild(tempArea);
        tempArea.select();
        try {
            document.execCommand("copy");
            showToast("Text copy ho gaya!");
        } catch (err) {
            showToast("Copy failed", "error");
        }
        document.body.removeChild(tempArea);
    };

    const handlePasteTextIntoNote = async () => {
        let pastedText = "";
        try {
            if (navigator.clipboard && navigator.clipboard.readText) {
                pastedText = await navigator.clipboard.readText();
            }
        } catch (err) {}

        if (!pastedText) {
            // Fallback using temporary editable input so paste works inside restricted iframes too
            const tempInput = document.createElement("textarea");
            tempInput.style.position = "fixed";
            tempInput.style.opacity = "0";
            document.body.appendChild(tempInput);
            tempInput.focus();
            document.execCommand("paste");
            pastedText = tempInput.value;
            document.body.removeChild(tempInput);
        }

        if (pastedText && pastedText.trim()) {
            const selectedEl = activePage.elements.find(el => el.id === selectedElementId && el.kind === "text");
            if (selectedEl) {
                updateActivePage(pg => ({
                    ...pg,
                    elements: pg.elements.map(el => el.id === selectedEl.id ? { ...el, text: (el.text ? el.text + " " : "") + pastedText } : el)
                }));
                showToast("Text paste ho gaya!");
            } else {
                handleAddTextBox(60, 70, pastedText);
                showToast("Naye text box me paste ho gaya!");
            }
        } else {
            // Create a focused text box ready for Ctrl+V / Long-press Paste
            const newId = "txt-" + Date.now();
            const newTextEl = {
                id: newId,
                kind: "text",
                text: "",
                color: penColor,
                fontSize: textSize,
                x: 60,
                y: 70,
                width: 260
            };
            updateActivePage(pg => ({
                ...pg,
                elements: [...pg.elements, newTextEl]
            }));
            setSelectedElementId(newId);
            setEditingTextId(newId);
            setTool("select");
            showToast("Text box khul gaya hai — ab Ctrl+V ya Paste dabayein!");
        }
    };

    const handlePointerDown = (e) => {
        if (!boardRef.current) return;
        const pt = getBoardCoords(e);

        if (tool === "text") {
            handleAddTextBox(pt.x, pt.y, "");
            return;
        }

        if (tool === "select") {
            if (e.target === boardRef.current || e.target.tagName === "svg") {
                setSelectedElementId(null);
                setEditingTextId(null);
            }
            return;
        }

        if (tool === "eraser") {
            // Erase strokes/shapes near click
            updateActivePage(pg => ({
                ...pg,
                elements: pg.elements.filter(el => {
                    if (el.kind === "stroke") {
                        return !el.points.some(p => Math.hypot(p.x - pt.x, p.y - pt.y) < 18);
                    }
                    if (el.kind === "shape") {
                        const minX = Math.min(el.x1, el.x2) - 12;
                        const maxX = Math.max(el.x1, el.x2) + 12;
                        const minY = Math.min(el.y1, el.y2) - 12;
                        const maxY = Math.max(el.y1, el.y2) + 12;
                        return !(pt.x >= minX && pt.x <= maxX && pt.y >= minY && pt.y <= maxY);
                    }
                    return true;
                })
            }));
            return;
        }

        setIsDrawing(true);
        setSelectedElementId(null);

        if (tool === "pen") {
            setCurrentDraft({
                id: "el-" + Date.now(),
                kind: "stroke",
                color: penColor,
                size: penSize,
                points: [pt]
            });
        } else if (["rect", "circle", "line", "triangle"].includes(tool)) {
            setCurrentDraft({
                id: "el-" + Date.now(),
                kind: "shape",
                shapeType: tool,
                color: penColor,
                size: penSize,
                x1: pt.x,
                y1: pt.y,
                x2: pt.x,
                y2: pt.y
            });
        }
    };

    const handlePointerMove = (e) => {
        if (!boardRef.current) return;

        if (dragAction) {
            e.preventDefault();
            const pt = getBoardCoords(e);
            const dx = pt.x - dragAction.startX;
            const dy = pt.y - dragAction.startY;
            updateActivePage(pg => ({
                ...pg,
                elements: pg.elements.map(el => {
                    if (el.id !== dragAction.elId) return el;
                    if (dragAction.mode === "move") {
                        return { ...el, x: Math.max(0, dragAction.origX + dx), y: Math.max(0, dragAction.origY + dy) };
                    } else if (dragAction.mode === "resize") {
                        return {
                            ...el,
                            width: Math.max(40, dragAction.origW + dx),
                            height: Math.max(40, dragAction.origH + dy)
                        };
                    }
                    return el;
                })
            }));
            return;
        }

        if (!isDrawing || !currentDraft) return;
        e.preventDefault();
        const pt = getBoardCoords(e);

        if (currentDraft.kind === "stroke") {
            setCurrentDraft(prev => ({
                ...prev,
                points: [...prev.points, pt]
            }));
        } else if (currentDraft.kind === "shape") {
            setCurrentDraft(prev => ({
                ...prev,
                x2: pt.x,
                y2: pt.y
            }));
        }
    };

    const handlePointerUp = () => {
        if (dragAction) {
            setDragAction(null);
            return;
        }
        if (isDrawing && currentDraft) {
            updateActivePage(pg => ({
                ...pg,
                elements: [...pg.elements, currentDraft]
            }));
        }
        setIsDrawing(false);
        setCurrentDraft(null);
    };

    const handleUndo = () => {
        updateActivePage(pg => ({
            ...pg,
            elements: pg.elements.slice(0, -1)
        }));
    };

    const handleImageFileChoose = (e) => {
        const file = e.target.files?.[0];
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            setCropRawImage(ev.target.result);
            setCropRect({ x: 5, y: 5, w: 90, h: 90 });
        };
        reader.readAsDataURL(file);
        e.target.value = "";
    };

    const handleApplyCropAndInsert = () => {
        if (!cropRawImage) return;
        const img = new Image();
        img.onload = () => {
            const sx = (cropRect.x / 100) * img.width;
            const sy = (cropRect.y / 100) * img.height;
            const sw = Math.max(10, (cropRect.w / 100) * img.width);
            const sh = Math.max(10, (cropRect.h / 100) * img.height);

            const canvas = document.createElement("canvas");
            const maxDim = 450;
            const scale = Math.min(1, maxDim / Math.max(sw, sh));
            canvas.width = sw * scale;
            canvas.height = sh * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

            const croppedDataUrl = canvas.toDataURL("image/jpeg", 0.82);
            const newImgEl = {
                id: "img-" + Date.now(),
                kind: "image",
                src: croppedDataUrl,
                x: 40,
                y: 40,
                width: Math.min(220, canvas.width),
                height: Math.min(220, canvas.height)
            };
            updateActivePage(pg => ({
                ...pg,
                elements: [...pg.elements, newImgEl]
            }));
            setSelectedElementId(newImgEl.id);
            setTool("select");
            setCropRawImage(null);
            showToast("Image crop karke note me add kar di gayi! Ab aap ise move/resize kar sakte hain.");
        };
        img.src = cropRawImage;
    };

    const handleDeleteSelectedImage = () => {
        if (!selectedElementId) return;
        updateActivePage(pg => ({
            ...pg,
            elements: pg.elements.filter(el => el.id !== selectedElementId)
        }));
        setSelectedElementId(null);
    };

    const renderSvgElement = (el) => {
        if (el.kind === "stroke") {
            if (!el.points || el.points.length === 0) return null;
            const d = el.points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
            return <path key={el.id} d={d} stroke={el.color} strokeWidth={el.size} fill="none" strokeLinecap="round" strokeLinejoin="round" />;
        }
        if (el.kind === "shape") {
            const x = Math.min(el.x1, el.x2);
            const y = Math.min(el.y1, el.y2);
            const w = Math.abs(el.x2 - el.x1);
            const h = Math.abs(el.y2 - el.y1);
            if (el.shapeType === "rect") {
                return <rect key={el.id} x={x} y={y} width={w} height={h} stroke={el.color} strokeWidth={el.size} fill="none" />;
            }
            if (el.shapeType === "circle") {
                return <ellipse key={el.id} cx={x + w / 2} cy={y + h / 2} rx={w / 2} ry={h / 2} stroke={el.color} strokeWidth={el.size} fill="none" />;
            }
            if (el.shapeType === "line") {
                return <line key={el.id} x1={el.x1} y1={el.y1} x2={el.x2} y2={el.y2} stroke={el.color} strokeWidth={el.size} strokeLinecap="round" />;
            }
            if (el.shapeType === "triangle") {
                const topX = x + w / 2;
                const pts = `${topX},${y} ${x},${y + h} ${x + w},${y + h}`;
                return <polygon key={el.id} points={pts} stroke={el.color} strokeWidth={el.size} fill="none" strokeLinejoin="round" />;
            }
        }
        return null;
    };

    const selectedPagesCount = pages.filter(p => p.selected).length;
    const colorsPalette = ["#1e293b", "#2563eb", "#dc2626", "#059669", "#d97706", "#7c3aed", "#db2777"];

    return (
        <div className="fixed inset-0 z-[80] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 animate-fade-in print-hide">
            <div className="bg-white w-full max-w-6xl h-[94vh] rounded-3xl shadow-2xl border border-indigo-100 flex flex-col overflow-hidden">
                {/* Top Header */}
                <div className="bg-gradient-to-r from-portal-blue via-indigo-600 to-slate-900 text-white px-4 py-3 flex items-center justify-between gap-2 shrink-0">
                    <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center">
                            <BookMarked className="h-5 w-5 text-yellow-300" />
                        </div>
                        <div>
                            <h2 className="font-bubble text-base sm:text-lg font-bold leading-none">EIND Personal Notebook</h2>
                            <p className="text-[10px] text-indigo-100 mt-0.5">{studentName || "Student"} • Auto-Saved Personal Notes</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <button onClick={() => window.print()} className="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
                            <Printer className="h-3.5 w-3.5" /> <span className="hidden sm:inline">Print / PDF</span>
                        </button>
                        <button onClick={onClose} className="bg-rose-500 hover:bg-rose-600 text-white p-2 rounded-xl transition">
                            <X className="h-4 w-4" />
                        </button>
                    </div>
                </div>

                {/* Page Selector & Page Type Bar */}
                <div className="bg-slate-100 border-b border-slate-200 px-3 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
                    {/* Multi-page tabs with selection checkboxes */}
                    <div className="flex items-center gap-1.5 overflow-x-auto scrollbar-hide max-w-full sm:max-w-[55%]">
                        {pages.map((pg, idx) => (
                            <div
                                key={pg.id}
                                onClick={() => { setActivePageIdx(idx); setSelectedElementId(null); }}
                                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer border transition shrink-0 ${activePageIdx === idx ? "bg-portal-blue text-white border-portal-blue shadow-sm" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"}`}
                            >
                                <input
                                    type="checkbox"
                                    checked={!!pg.selected}
                                    onClick={(e) => e.stopPropagation()}
                                    onChange={() => toggleSelectNotePage(idx)}
                                    title="Select Note Page"
                                    className="rounded accent-yellow-400 cursor-pointer"
                                />
                                <span>{pg.title}</span>
                                <span className={`text-[9px] uppercase px-1.5 py-0.2 rounded ${activePageIdx === idx ? "bg-white/20 text-yellow-200" : "bg-slate-100 text-slate-500"}`}>
                                    {pg.pageType}
                                </span>
                            </div>
                        ))}
                        <button onClick={() => handleAddPage(activePage.pageType)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl flex items-center gap-1 shrink-0">
                            <Plus className="h-3.5 w-3.5" /> Page
                        </button>

                        <option value={7}>Pen 7px</option>

                                    ...pg,
                                    elements: pg.elements.map(el => el.id === selectedElementId && el.kind === "text" ? { ...el, fontSize: newSz } : el)
                                }));
                            }

                        <option value={18}>Text 18px</option>
                        <option value={22}>Text 22px</option>
                        <option value={28}>Text 28px</option>

                    {/* Copy & Paste Text Buttons */}
                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">

                        >
                            <Copy className="h-3.5 w-3.5" /> <span>Copy</span>
                        </button>
                        <button
                            onClick={handlePasteTextIntoNote}
                            title="Paste Text into Note"
                            className="bg-white hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 text-xs font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1 border border-slate-200 transition"

                    </div>

                    {/* Image Upload + Crop Trigger */}

                        className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition"
                    >
                        <ImageIcon className="h-4 w-4" /> <span>Add & Crop Image</span>
                    </button>

                    {selectedElementId && (
                        <button
                            onClick={handleDeleteSelectedImage}
                            className="bg-rose-100 text-rose-700 hover:bg-rose-200 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1"
                        >
                            <Trash2 className="h-3.5 w-3.5" /> Delete Selected

                        onTouchMove={handlePointerMove}

                                        setTextSize(txtEl.fontSize || 18);

                                            const pt = getBoardCoords(e);
                                            setDragAction({
                                                mode: "move",
                                                elId: txtEl.id,
                                                startX: pt.x,
                                                startY: pt.y,
                                                origX: txtEl.x,
                                                origY: txtEl.y
                                            });
                                        }
                                    }}
                                    onTouchStart={(e) => {
                                        e.stopPropagation();
                                        setTool("select");
                                        setSelectedElementId(txtEl.id);
                                        setPenColor(txtEl.color || "#1e293b");
                                        setTextSize(txtEl.fontSize || 18);
                                        if (!isEditing) {
                                            const pt = getBoardCoords(e);
                                            setDragAction({
                                                mode: "move",
                                                elId: txtEl.id,
                                                startX: pt.x,
                                                startY: pt.y,
                                                origX: txtEl.x,
                                                origY: txtEl.y
                                            });
                                        }
                                    }}

                                        e.stopPropagation();
                                        setEditingTextId(txtEl.id);

                                        position: "absolute",
                                        left: txtEl.x,
                                        top: txtEl.y,

                                                onClick={(e) => {
                                                    e.stopPropagation();

                                                const val = e.target.value;

                                                }));

                                                color: txtEl.color,

                                            }}

                                                color: txtEl.color,
                                                fontSize: `${txtEl.fontSize}px`,
                                                lineHeight: 1.4

                                    )}

                        {/* Uploaded / Cropped Images Layer (Selectable, Movable, Resizable) */}
                        {activePage.elements.filter(el => el.kind === "image").map(imgEl => {
                            const isSelected = selectedElementId === imgEl.id;
                            return (
                                <div
                                    key={imgEl.id}
                                    onMouseDown={(e) => {
                                        e.stopPropagation();
                                        setTool("select");
                                        setSelectedElementId(imgEl.id);

                                        setDragAction({
                                            mode: "move",
                                            elId: imgEl.id,
                                            startX: pt.x,
                                            startY: pt.y,
                                            origX: imgEl.x,
                                            origY: imgEl.y
                                        });
                                    }}
                                    onTouchStart={(e) => {
                                        e.stopPropagation();
                                        setTool("select");
                                        setSelectedElementId(imgEl.id);
                                        const pt = getBoardCoords(e);
                                        setDragAction({
                                            mode: "move",
                                            elId: imgEl.id,
                                            startX: pt.x,
                                            startY: pt.y,
                                            origX: imgEl.x,
                                            origY: imgEl.y

                                        position: "absolute",
                                        left: imgEl.x,
                                        top: imgEl.y,
                                        width: imgEl.width,
                                        height: imgEl.height,

                                    <img src={imgEl.src} alt="Note Attachment" className="w-full h-full object-fill pointer-events-none rounded" />

                                        <>
                                            <span className="absolute -top-6 left-0 bg-portal-blue text-white text-[9px] font-bold px-2 py-0.5 rounded shadow">

                                                onMouseDown={(e) => {
                                                    e.stopPropagation();
                                                    const pt = getBoardCoords(e);
                                                    setDragAction({
                                                        mode: "resize",
                                                        elId: imgEl.id,
                                                        startX: pt.x,
                                                        startY: pt.y,
                                                        origW: imgEl.width,
                                                        origH: imgEl.height
                                                    });
                                                }}
                                                onTouchStart={(e) => {
                                                    e.stopPropagation();
                                                    const pt = getBoardCoords(e);
                                                    setDragAction({
                                                        mode: "resize",
                                                        elId: imgEl.id,
                                                        startX: pt.x,
                                                        startY: pt.y,
                                                        origW: imgEl.width,
                                                        origH: imgEl.height
                                                    });
                                                }}

                                                title="Resize Image"
                                            >
                                                ↘
                                            </div>
                                        </>
                                    )}
                                </div>
                            );
                        })}

                        {/* SVG Vector Layer for Pens & Shapes */}
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-15">
                            {activePage.elements.filter(el => el.kind !== "image").map(el => renderSvgElement(el))}
                            {currentDraft && renderSvgElement(currentDraft)}
                        </svg>
                    </div>
                </div>
            </div>

            {/* Image Crop Modal */}
            {cropRawImage && (
                <div className="fixed inset-0 z-[95] bg-black/80 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl animate-fade-in">
                        <div className="flex items-center justify-between border-b pb-2">
                            <h3 className="font-bubble text-lg font-bold text-slate-900 flex items-center gap-2">
                                <Crop className="h-5 w-5 text-amber-500" /> Crop Image Before Adding
                            </h3>
                            <button onClick={() => setCropRawImage(null)} className="text-slate-400 hover:text-slate-700"><X className="h-5 w-5" /></button>
                        </div>

                        <div className="relative w-full h-56 bg-slate-900 rounded-2xl overflow-hidden flex items-center justify-center">
                            <img src={cropRawImage} alt="To Crop" className="max-h-full max-w-full object-contain opacity-60" />
                            <div
                                style={{
                                    left: `${cropRect.x}%`,
                                    top: `${cropRect.y}%`,
                                    width: `${cropRect.w}%`,
                                    height: `${cropRect.h}%`
                                }}
                                className="absolute border-2 border-yellow-300 bg-white/10 shadow-[0_0_0_9999px_rgba(0,0,0,0.45)] pointer-events-none"
                            />
                        </div>

                        <div className="grid grid-cols-2 gap-3 text-xs font-bold text-slate-700">
                            <div>
                                <label>Left Crop ({cropRect.x}%)</label>
                                <input type="range" min="0" max="60" value={cropRect.x} onChange={e => setCropRect(r => ({ ...r, x: Number(e.target.value), w: Math.min(r.w, 100 - Number(e.target.value)) }))} className="w-full accent-portal-blue" />
                            </div>
                            <div>
                                <label>Top Crop ({cropRect.y}%)</label>
                                <input type="range" min="0" max="60" value={cropRect.y} onChange={e => setCropRect(r => ({ ...r, y: Number(e.target.value), h: Math.min(r.h, 100 - Number(e.target.value)) }))} className="w-full accent-portal-blue" />
                            </div>
                            <div>
                                <label>Width ({cropRect.w}%)</label>
                                <input type="range" min="20" max={100 - cropRect.x} value={cropRect.w} onChange={e => setCropRect(r => ({ ...r, w: Number(e.target.value) }))} className="w-full accent-portal-blue" />
                            </div>
                            <div>
                                <label>Height ({cropRect.h}%)</label>
                                <input type="range" min="20" max={100 - cropRect.y} value={cropRect.h} onChange={e => setCropRect(r => ({ ...r, h: Number(e.target.value) }))} className="w-full accent-portal-blue" />
                            </div>
                        </div>

                        <div className="flex gap-3 pt-2">
                            <button onClick={() => setCropRawImage(null)} className="flex-1 py-2.5 border rounded-xl text-xs font-bold text-slate-600">Cancel</button>
                            <button onClick={handleApplyCropAndInsert} className="flex-1 py-2.5 bg-portal-blue hover:bg-portal-darkblue text-white rounded-xl text-xs font-bold shadow">
                                Crop & Insert Note
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

    /* Generic Image Compression Helper */
    const compressImageFile = (file, maxWidth, quality, callback) => {
        if (!file || !file.type.startsWith("image/")) {
            showToast("Sirf image file select karein!", "error");
            return;
        }
        setUploadingImage(true);
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                const scale = Math.min(1, maxWidth / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL("image/jpeg", quality));
                setUploadingImage(false);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

    const getTestLeaderboard = (testId) => {
        const raw = testResults.filter(r => r.testId === testId);

        raw.forEach(r => {
            if (!byStudent[r.studentId] || r.score > byStudent[r.studentId].score) {
                byStudent[r.studentId] = r;
            }
        });
        const sorted = Object.values(byStudent).sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0);
        });
        let currentRank = 1;
        return sorted.map((item, idx) => {
            if (idx > 0 && item.score < sorted[idx - 1].score) {
                currentRank = idx + 1;
            }
            return { ...item, rank: currentRank };
        });
    };
