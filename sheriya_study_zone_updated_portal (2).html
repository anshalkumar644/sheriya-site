                                                        >
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-10 h-10 rounded-xl bg-indigo-100 text-portal-blue flex items-center justify-center font-bubble font-bold text-sm shrink-0">
                                                                    {subj.charAt(0)}
                                                                </div>
                                                                <span className="font-bold text-xs sm:text-sm text-slate-800 group-hover:text-portal-blue">{subj}</span>
                                                            </div>
                                                            <ChevronRight className="h-4 w-4 text-slate-400 group-hover:text-portal-blue" />
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* STEP 2: LIVE BSEB OBJECTIVE QUESTION SESSION WITH 4 OPTIONS & FINISH BUTTON */}
                                        {shwetaSubject && !shwetaReportCard && (
                                            <div className="max-w-2xl mx-auto space-y-4">
                                                <div className="bg-white rounded-2xl p-4 border border-slate-200 flex flex-wrap items-center justify-between gap-2 shadow-sm">
                                                    <div>
                                                        <span className="text-[10px] font-extrabold uppercase text-rose-600 block">Subject: {shwetaSubject}</span>
                                                        <p className="text-xs font-bold text-slate-700">
                                                            Attempted: {shwetaHistory.length} • Sahi: <span className="text-emerald-600">{shwetaHistory.filter(h => h.isCorrect).length}</span> • Galat: <span className="text-rose-600">{shwetaHistory.filter(h => !h.isCorrect).length}</span>
                                                        </p>
                                                    </div>
                                                    <button
                                                        onClick={handleFinishShwetaExam}
                                                        disabled={shwetaHistory.length === 0}
                                                        className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bubble font-bold text-xs px-5 py-2.5 rounded-xl shadow flex items-center gap-1.5"
                                                    >
                                                        <CheckCircle className="h-4 w-4" /> Finish Exam & Get Report Card
                                                    </button>
                                                </div>

                                                {shwetaQuestionLoading ? (
                                                    <div className="bg-white rounded-3xl p-12 text-center border space-y-3 shadow-soft-card">
                                                        <div className="w-10 h-10 border-4 border-indigo-200 border-t-portal-blue rounded-full animate-spin mx-auto"></div>
                                                        <p className="font-bubble text-sm font-bold text-slate-700">Shweta Helping Hand BSEB Question taiyar kar rahi hai...</p>
                                                    </div>
                                                ) : shwetaCurrentQ && (
                                                    <div className="bg-white rounded-3xl p-5 sm:p-6 border border-indigo-100 shadow-soft-card space-y-4">
                                                        <div className="flex items-center justify-between">
                                                            <span className="bg-indigo-50 text-portal-blue text-[11px] font-extrabold px-3 py-1 rounded-full">
                                                                Question #{shwetaHistory.length + (shwetaSelectedOpt !== null ? 0 : 1)} (BSEB Pattern)
                                                            </span>
                                                        </div>
                                                        <h4 className="font-bold text-sm sm:text-base text-slate-900 leading-relaxed">
                                                            {shwetaCurrentQ.question}
                                                        </h4>

                                                        <div className="space-y-2.5">
                                                            {shwetaCurrentQ.options.map((opt, idx) => {
                                                                const labels = ["A", "B", "C", "D"];
                                                                let btnClass = "bg-slate-50 hover:bg-indigo-50 border-slate-200 text-slate-800";
                                                                if (shwetaSelectedOpt !== null) {
                                                                    if (idx === shwetaCurrentQ.correctIndex) {
                                                                        btnClass = "bg-emerald-100 border-emerald-500 text-emerald-900 font-extrabold";
                                                                    } else if (idx === shwetaSelectedOpt) {
                                                                        btnClass = "bg-rose-100 border-rose-500 text-rose-900 font-extrabold";
                                                                    } else {
                                                                        btnClass = "bg-slate-50 border-slate-200 text-slate-400";
                                                                    }
                                                                }
                                                                return (
                                                                    <button
                                                                        key={idx}
                                                                        disabled={shwetaSelectedOpt !== null}
                                                                        onClick={() => handleShwetaChooseOption(idx)}
                                                                        className={`w-full p-3.5 rounded-2xl border text-left text-xs sm:text-sm font-semibold flex items-center gap-3 transition ${btnClass}`}
                                                                    >
                                                                        <span className="w-7 h-7 rounded-xl bg-white border flex items-center justify-center font-black text-xs shrink-0">
                                                                            {labels[idx]}
                                                                        </span>
                                                                        <span className="flex-1">{opt}</span>
                                                                        {shwetaSelectedOpt !== null && idx === shwetaCurrentQ.correctIndex && <CheckCircle className="h-5 w-5 text-emerald-600 shrink-0" />}
                                                                        {shwetaSelectedOpt !== null && idx === shwetaSelectedOpt && idx !== shwetaCurrentQ.correctIndex && <XCircle className="h-5 w-5 text-rose-600 shrink-0" />}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>

                                                        {shwetaSelectedOpt !== null && (
                                                            <div className="pt-3 border-t space-y-3 animate-fade-in">
                                                                <div className={`p-3 rounded-2xl text-xs font-semibold ${shwetaSelectedOpt === shwetaCurrentQ.correctIndex ? "bg-emerald-50 text-emerald-800 border border-emerald-200" : "bg-amber-50 text-amber-900 border border-amber-200"}`}>
                                                                    <strong>{shwetaSelectedOpt === shwetaCurrentQ.correctIndex ? "Bilkul Sahi Jawab! 🎉" : "Galat Jawab!"}</strong> {shwetaCurrentQ.explanation}
                                                                </div>
                                                                <div className="flex gap-2.5">
                                                                    <button
                                                                        onClick={() => generateNextBsebQuestion(shwetaSubject, shwetaHistory)}
                                                                        className="flex-1 bg-portal-blue hover:bg-portal-darkblue text-white font-bubble font-bold py-3 rounded-2xl text-xs sm:text-sm shadow flex items-center justify-center gap-1.5"
                                                                    >
                                                                        <span>Next Question</span> <ChevronRight className="h-4 w-4" />
                                                                    </button>
                                                                    <button
                                                                        onClick={handleFinishShwetaExam}
                                                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bubble font-bold px-5 py-3 rounded-2xl text-xs sm:text-sm shadow"
                                                                    >
                                                                        Finish
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* STEP 3: REPORT CARD WITH PDF DOWNLOAD + AUTO-SAVED TO TEACHER PORTAL */}
                                        {shwetaReportCard && (
                                            <div className="max-w-2xl mx-auto space-y-5 animate-fade-in">
                                                <div className="bg-white rounded-3xl p-6 border-2 border-indigo-200 shadow-soft-card space-y-4">
                                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b pb-4">
                                                        <div>
                                                            <span className="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold uppercase px-3 py-1 rounded-full">
                                                                Saved in Teacher Portal ✓
                                                            </span>
                                                            <h3 className="font-bubble text-xl sm:text-2xl font-bold text-slate-900 mt-1">
                                                                BSEB Exam Report Card
                                                            </h3>
                                                            <p className="text-xs font-semibold text-slate-500">
                                                                {shwetaReportCard.studentName} • {shwetaReportCard.studentClass} • {shwetaReportCard.subject}
                                                            </p>
                                                        </div>
                                                        <button
                                                            onClick={() => handlePrintShwetaPdf(shwetaReportCard)}
                                                            className="bg-portal-blue hover:bg-portal-darkblue text-white font-bubble font-bold text-xs px-4 py-3 rounded-2xl shadow-glow-purple flex items-center justify-center gap-1.5 shrink-0"
                                                        >
                                                            <Download className="h-4 w-4" /> Download Report Card (PDF)
                                                        </button>
                                                    </div>

                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                                                        <div className="bg-indigo-50 p-3 rounded-2xl border border-indigo-100">
                                                            <span className="text-[10px] font-bold text-portal-blue uppercase block">Total Marks</span>
                                                            <span className="font-mono text-xl font-black text-slate-900">{shwetaReportCard.marks}/{shwetaReportCard.maxMarks}</span>
                                                        </div>
                                                        <div className="bg-amber-50 p-3 rounded-2xl border border-amber-100">
                                                            <span className="text-[10px] font-bold text-amber-700 uppercase block">Percentage</span>
                                                            <span className="font-mono text-xl font-black text-amber-700">{shwetaReportCard.percentage}%</span>
                                                        </div>
                                                        <div className="bg-emerald-50 p-3 rounded-2xl border border-emerald-200">
                                                            <span className="text-[10px] font-bold text-emerald-700 uppercase block">Sahi (Correct)</span>
                                                            <span className="font-mono text-xl font-black text-emerald-700">{shwetaReportCard.correctCount}</span>
                                                        </div>
                                                        <div className="bg-rose-50 p-3 rounded-2xl border border-rose-200">
                                                            <span className="text-[10px] font-bold text-rose-700 uppercase block">Galat (Wrong)</span>
                                                            <span className="font-mono text-xl font-black text-rose-700">{shwetaReportCard.wrongCount}</span>
                                                        </div>
                                                    </div>

                                                    <div className="space-y-2.5 pt-2">
                                                        <h4 className="font-bold text-xs uppercase text-slate-400">Questions Summary</h4>
                                                        {shwetaReportCard.questions.map((q, i) => (
                                                            <div key={i} className={`p-3 rounded-2xl border text-xs ${q.isCorrect ? "bg-emerald-50/70 border-emerald-200" : "bg-rose-50/70 border-rose-200"}`}>
                                                                <p className="font-bold text-slate-900">Q{i + 1}. {q.question}</p>
                                                                <p className="mt-1">
                                                                    Your Choice: <strong>{q.options[q.selectedIndex]}</strong>{" "}
                                                                    <span className={`font-extrabold ${q.isCorrect ? "text-emerald-700" : "text-rose-700"}`}>
                                                                        ({q.isCorrect ? "Sahi ✓" : "Galat ✗"})
                                                                    </span>
                                                                </p>
                                                                {!q.isCorrect && (
                                                                    <p className="text-emerald-800 font-semibold mt-0.5">Correct Answer: {q.options[q.correctIndex]}</p>
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>

                                                    <button
                                                        onClick={() => { setShwetaSubject(null); setShwetaReportCard(null); setShwetaHistory([]); }}
                                                        className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bubble font-bold py-3 rounded-2xl text-xs"
                                                    >
                                                        Choose Another Subject
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* EIND WINDOW: TEACHER SUPPORT + CHAT WITH YOUR CLASSMATE (WITH FOCUS MODE PRIVACY) */}
                        {showTeacherChat && (
                            <div className="fixed bottom-20 sm:bottom-24 right-4 sm:right-6 w-[calc(100vw-32px)] sm:w-96 bg-white rounded-3xl shadow-2xl border border-slate-200 flex flex-col h-[66vh] sm:h-[540px] z-50 animate-fade-in overflow-hidden print-hide">
                                <div className="p-3.5 bg-portal-blue text-white space-y-2.5 shrink-0">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h3 className="font-bubble font-bold text-sm">EIND Connect</h3>
                                            <p className="text-[10px] text-indigo-100">Teacher Support & Classmate Chat</p>
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <button
                                                onClick={() => { setShowTeacherChat(false); setShowEindNotebook(true); }}
                                                className="bg-amber-400 text-slate-950 text-[10px] font-extrabold px-2.5 py-1 rounded-xl flex items-center gap-1"
                                            >
                                                <BookMarked className="h-3 w-3" /> Notebook
                                            </button>
                                            <button onClick={() => setShowTeacherChat(false)} className="text-white/80 hover:text-white p-1"><X className="h-5 w-5"/></button>
                                        </div>
                                    </div>

                                    {/* Tabs inside EIND: Teacher Support vs Chat with your Classmate */}
                                    <div className="flex bg-black/20 p-1 rounded-2xl gap-1">
                                        <button
                                            onClick={() => setEindTab("teacher")}
                                            className={`flex-1 py-1.5 rounded-xl text-[11px] font-bubble font-bold transition ${eindTab === "teacher" ? "bg-white text-portal-blue shadow" : "text-indigo-100 hover:text-white"}`}
                                        >
                                            Teacher Support
                                        </button>
                                        <button
                                            onClick={() => setEindTab("classmates")}
                                            className={`flex-1 py-1.5 rounded-xl text-[11px] font-bubble font-bold transition ${eindTab === "classmates" ? "bg-white text-portal-blue shadow" : "text-indigo-100 hover:text-white"}`}
                                        >
                                            Chat with Classmate ({availableClassmates.length})
                                        </button>
                                    </div>
                                </div>

                                {/* TAB 1: TEACHER DIRECT SUPPORT */}
                                {eindTab === "teacher" && (
                                    <>
                                        <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3 bg-slate-50">
                                            <div className="bg-white p-3 rounded-xl border shadow-sm text-center space-y-2 mb-4 shrink-0">
                                                <p className="text-[11px] font-bold text-slate-500">Need urgent help?</p>
                                                <button onClick={requestCall} className="bg-emerald-100 text-emerald-700 border border-emerald-200 text-[11px] font-bold px-4 py-2 rounded-lg flex items-center justify-center gap-1.5 w-full hover:bg-emerald-200 transition"><PhoneCall className="h-3.5 w-3.5"/> Request a Call Back</button>
                                            </div>
                                            {directMessages.filter(m => m.studentId === loggedInStudentMobile).map(m => {
                                                const isMe = m.sender === "student";
                                                return (
                                                    <div key={m.id} className={`flex flex-col ${isMe ? "items-end" : "items-start"}`}>
                                                        <div className={`px-4 py-2.5 rounded-2xl text-xs font-semibold max-w-[85%] break-words ${isMe ? "bg-portal-blue text-white rounded-tr-none" : "bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm"}`}>{m.text}</div>
                                                        <span className="text-[9px] font-bold text-slate-400 mt-0.5 px-1">{m.timeString}</span>
                                                    </div>
                                                );
                                            })}
                                            <div ref={directChatEndRef} />
                                        </div>
                                        <form onSubmit={(e) => sendDirectMessage(e, null)} className="p-3 border-t bg-white flex gap-2 shrink-0">
                                            <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Type a message..." className="flex-1 border rounded-2xl px-4 py-2 text-xs outline-none focus:border-portal-blue bg-slate-50" />
                                            <button type="submit" disabled={!chatInput.trim()} className="w-10 h-10 bg-portal-blue text-white rounded-2xl flex justify-center items-center shadow-md"><Send className="h-4 w-4"/></button>
                                        </form>
                                    </>
                                )}

                                {/* TAB 2: CHAT WITH YOUR CLASSMATE (FOCUS MODE AWARE) */}
                                {eindTab === "classmates" && (
                                    <>
                                        {studentDetails.focusMode ? (
                                            <div className="flex-1 p-6 flex flex-col items-center justify-center text-center bg-amber-50/60 space-y-3">
                                                <div className="w-14 h-14 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center shadow">
                                                    <Zap className="h-7 w-7 fill-slate-950" />
                                                </div>
                                                <h4 className="font-bubble text-base font-bold text-slate-900">Focus Mode ON Hai!</h4>
                                                <p className="text-xs text-slate-600 font-medium">
                                                    Abhi aapka naam classmate chat list se hidden hai. Classmates se chat karne ke liye Focus Mode OFF karein.
                                                </p>
                                                <button
                                                    onClick={handleToggleFocusMode}
                                                    className="bg-portal-blue text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow"
                                                >
                                                    Turn OFF Focus Mode
                                                </button>
                                            </div>
                                        ) : !activeClassmate ? (
                                            <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2 bg-slate-50">
                                                <div className="flex items-center justify-between px-1 pb-1">
                                                    <span className="text-[10px] font-extrabold uppercase text-slate-400">
                                                        Active Classmates ({availableClassmates.length})
                                                    </span>
                                                    <button
                                                        onClick={handleToggleFocusMode}
                                                        className="text-[10px] font-bold text-amber-700 bg-amber-100 px-2.5 py-0.5 rounded-full"
                                                    >
                                                        Turn ON Focus Mode
                                                    </button>
                                                </div>

                                                {availableClassmates.map(mate => {
                                                    const pairKey = getChatPairKey(loggedInStudentMobile, mate.id);
                                                    const pairMsgs = classmateMessages.filter(m => m.pairKey === pairKey);
                                                    const lastMsg = pairMsgs[pairMsgs.length - 1];
                                                    return (
                                                        <div
                                                            key={mate.id}
                                                            onClick={() => setActiveClassmate(mate)}
                                                            className="p-3 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-portal-blue rounded-2xl cursor-pointer transition flex items-center gap-3 shadow-sm"
                                                        >
                                                            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-portal-blue to-indigo-600 text-white flex items-center justify-center font-bold text-sm shrink-0 uppercase">
                                                                {(mate.name || "S").charAt(0)}
                                                            </div>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="flex items-center justify-between gap-1">
                                                                    <h4 className="text-xs font-extrabold text-slate-900 truncate">{mate.name || mate.id}</h4>
                                                                    <span className="text-[9px] font-bold bg-indigo-50 text-portal-blue px-2 py-0.5 rounded-full shrink-0">
                                                                        {mate.studentClass || "Student"}
                                                                    </span>
                                                                </div>
                                                                <p className="text-[10px] text-slate-500 truncate mt-0.5">
                                                                    {lastMsg ? lastMsg.text : "Tap karke chat shuru karein..."}
                                                                </p>
                                                            </div>
                                                        </div>
                                                    );
                                                })}

                                                {availableClassmates.length === 0 && (
                                                    <div className="text-center py-14 text-slate-400 space-y-1">
                                                        <Users className="h-8 w-8 mx-auto text-slate-300" />
                                                        <p className="text-xs font-bold">Abhi koi classmate chat ke liye available nahi hai.</p>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            /* Active Classmate Chat Conversation */
                                            <>
                                                <div className="px-3 py-2.5 bg-indigo-50 border-b border-indigo-100 flex items-center justify-between shrink-0">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <button onClick={() => setActiveClassmate(null)} className="p-1.5 bg-white rounded-xl border text-slate-700 hover:bg-slate-100">
                                                            <ArrowLeft className="h-3.5 w-3.5" />
                                                        </button>
                                                        <div className="min-w-0">
                                                            <h4 className="text-xs font-extrabold text-slate-900 truncate">{activeClassmate.name || activeClassmate.id}</h4>
                                                            <span className="text-[9px] font-bold text-emerald-600 block">
                                                                {activeClassmate.studentClass || "Classmate"} • Online
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3 bg-slate-50">
                                                    {classmateMessages
                                                        .filter(m => m.pairKey === getChatPairKey(loggedInStudentMobile, activeClassmate.id))
                                                        .map(m => {
                                                            const isMe = m.senderId === loggedInStudentMobile;
                                                            return (
                                                                <div key={m.id} className={`flex flex-col ${isMe ? "items-end" : "items-start"}`}>
                                                                    <div className={`px-4 py-2.5 rounded-2xl text-xs font-semibold max-w-[85%] break-words ${isMe ? "bg-portal-blue text-white rounded-tr-none" : "bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm"}`}>
                                                                        {m.text}
                                                                    </div>
                                                                    <span className="text-[9px] font-bold text-slate-400 mt-0.5 px-1">{m.timeString}</span>
                                                                </div>
                                                            );
                                                        })}
                                                    <div ref={classmateChatEndRef} />
                                                </div>

                                                <form onSubmit={handleSendClassmateMessage} className="p-3 border-t bg-white flex gap-2 shrink-0">
                                                    <input
                                                        type="text"
                                                        value={classmateChatInput}
                                                        onChange={e => setClassmateChatInput(e.target.value)}
                                                        placeholder={`${activeClassmate.name || "Classmate"} ko message likhein...`}
                                                        className="flex-1 border rounded-2xl px-4 py-2 text-xs outline-none focus:border-portal-blue bg-slate-50"
                                                    />
                                                    <button type="submit" disabled={!classmateChatInput.trim()} className="w-10 h-10 bg-portal-blue text-white rounded-2xl flex justify-center items-center shadow-md disabled:opacity-50">
                                                        <Send className="h-4 w-4" />
                                                    </button>
                                                </form>
                                            </>
                                        )}
                                    </>
                                )}
                            </div>
                        )}
                    </>
                )}
            </main>

            <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs font-bold text-slate-400 select-none shrink-0 z-40 print-hide">
                <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <span className="flex items-center gap-1.5 text-portal-blue"><BookOpen className="h-4 w-4" /> Sheriya Study Zone</span>
                    <span>© {new Date().getFullYear()} • Developed for better education</span>
                </div>
            </footer>
        </div>
    );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
