/* =========================================================
   YOUTUBE ID
========================================================= */

const getYouTubeId = (url) => {

    if (!url) return null;

    const regExp =
        /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([^"&?\/\s]{11})/i;

    const match = url.match(regExp);

    return match ? match[1] : null;
};

        <div

    const handleImageUpload = (e, fieldName) => {

        const file = e.target.files?.[0];

        if (!file) return;


        if (!file.type.startsWith("image/")) {

            showToast(
                "Sirf image file upload karein.",
                "error"
            );

            return;
        }


        setUploadingImage(true);


        const reader = new FileReader();


        reader.onload = (event) => {

            const img = new Image();


            img.onload = () => {

                const maxWidth = 800;

                const scale =
                    Math.min(1, maxWidth / img.width);


                const canvas =
                    document.createElement("canvas");


                canvas.width =
                    Math.round(img.width * scale);


                canvas.height =
                    Math.round(img.height * scale);


                const ctx =
                    canvas.getContext("2d");


                ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                const data =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.65
                    );


                setNewCourse(prev => ({
                    ...prev,
                    [fieldName]: data
                }));


                setUploadingImage(false);

            };


            img.onerror = () => {

                setUploadingImage(false);

                showToast(
                    "Image process nahi ho saki.",
                    "error"
                );

            };


            img.src = event.target.result;

        };


        reader.onerror = () => {

            setUploadingImage(false);

            showToast(
                "Image read nahi ho saki.",
                "error"
            );

        };


        reader.readAsDataURL(file);

    };

                collection(

                    "artifacts",
                    appId,
                    "public",
                    "data",

                {

                                    </table>

                                </div>

                            </div>

                        )}


                        {/* COURSES */}

                        {teacherTab ===
                            "courses" && (

                            <div className="grid lg:grid-cols-3 gap-8">


                                <div className="lg:col-span-1 bg-white p-6 rounded-3xl shadow-sm border">

                                    <h3 className="font-bold text-slate-800 mb-4">

                                        Naya Course Banayein

                                    </h3>


                                    <form
                                        onSubmit={
                                            handleCreateCourse
                                        }
                                        className="space-y-4"
                                    >

                                        <input
                                            type="text"
                                            required
                                            value={
                                                newCourse.title
                                            }
                                            onChange={e =>
                                                setNewCourse({
                                                    ...newCourse,
                                                    title:
                                                        e.target.value
                                                })
                                            }
                                            className="w-full border rounded-lg py-2 px-3 text-sm"
                                            placeholder="Course Name"
                                        />


                                        <input
                                            type="number"
                                            required
                                            min="0"
                                            value={
                                                newCourse.price
                                            }
                                            onChange={e =>
                                                setNewCourse({
                                                    ...newCourse,
                                                    price:
                                                        e.target.value
                                                })
                                            }
                                            className="w-full border rounded-lg py-2 px-3 text-sm"
                                            placeholder="Price (₹)"
                                        />


                                        <div className="border border-dashed p-3 rounded-lg text-center">

                                            <input
                                                type="file"
                                                accept="image/*"
                                                onChange={e =>
                                                    handleImageUpload(
                                                        e,
                                                        "thumbnail"
                                                    )
                                                }
                                                className="w-full text-xs"
                                            />


                                            {newCourse.thumbnail && (

                                                <img
                                                    src={
                                                        newCourse.thumbnail
                                                    }
                                                    alt="Course"
                                                    className="mt-3 w-full h-32 object-cover rounded-lg"
                                                />

                                            )}

                                        </div>


                                        <input
                                            type="text"
                                            required
                                            value={
                                                newCourse.upiId
                                            }
                                            onChange={e =>
                                                setNewCourse({
                                                    ...newCourse,
                                                    upiId:
                                                        e.target.value
                                                })
                                            }
                                            className="w-full border rounded-lg py-2 px-3 text-sm"
                                            placeholder="UPI ID"
                                        />


                                        <div className="border border-dashed p-3 rounded-lg text-center">

                                            <input
                                                type="file"
                                                accept="image/*"
                                                onChange={e =>
                                                    handleImageUpload(
                                                        e,
                                                        "upiScanner"
                                                    )
                                                }
                                                className="w-full text-xs"
                                            />


                                            {newCourse.upiScanner && (

                                                <img
                                                    src={
                                                        newCourse.upiScanner
                                                    }
                                                    alt="UPI QR"
                                                    className="mt-3 w-32 h-32 object-contain mx-auto rounded-lg"
                                                />

                                            )}

                                        </div>


                                        <input
                                            type="tel"
                                            required
                                            maxLength="10"
                                            value={
                                                newCourse.contactNumber
                                            }
                                            onChange={e =>
                                                setNewCourse({
                                                    ...newCourse,
                                                    contactNumber:
                                                        e.target.value.replace(
                                                            /\D/g,
                                                            ""
                                                        )
                                                })
                                            }
                                            className="w-full border rounded-lg py-2 px-3 text-sm"
                                            placeholder="Contact Number"
                                        />


                                        <button
                                            type="submit"
                                            disabled={
                                                isSubmitting ||
                                                uploadingImage
                                            }
                                            className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl disabled:opacity-50"
                                        >

                                            {isSubmitting
                                                ? "Publishing..."
                                                : "Publish Course"}

                                        </button>

                                    </form>

                                </div>


                                <div className="lg:col-span-2 grid sm:grid-cols-2 gap-4">

                                    {courses.map(
                                        course => (

                                            <div
                                                key={
                                                    course.id
                                                }
                                                className="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex flex-col justify-between"
                                            >

                                                <div className="flex items-start space-x-4 mb-3">

                                                    <img
                                                        src={
                                                            course.thumbnail
                                                        }
                                                        alt=""
                                                        className="w-20 h-20 rounded-xl object-cover"
                                                    />


                                                    <div>

                                                        <h4 className="font-bold text-slate-800 text-sm">

                                                            {
                                                                course.title
                                                            }

                                                        </h4>


                                                        <p className="text-emerald-600 font-black mt-1">

                                                            ₹
                                                            {
                                                                course.price
                                                            }

                                                        </p>

                                                    </div>

                                                </div>


                                                <button
                                                    onClick={() => {

                                                        setActiveCourseId(
                                                            course.id
                                                        );

                                                        setContentTab(
                                                            "classes"
                                                        );

                                                        setCurrentView(
                                                            "teacher_course_manage"
                                                        );

                                                    }}
                                                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2 rounded-lg text-sm transition"
                                                >

                                                    Manage Content

                                                </button>

                                            </div>

                                        )
                                    )}


                                    {courses.length ===
                                        0 && (

                                        <div className="sm:col-span-2 bg-white border-2 border-dashed rounded-2xl p-10 text-center text-slate-500">

                                            Abhi koi course publish nahi hua hai.

                                        </div>

                                    )}

                                </div>

                            </div>

                        )}

                    </div>

                )}


                {/* =================================================
                   TEACHER COURSE MANAGER
                ================================================= */}

                {currentView ===
                    "teacher_course_manage" &&
                    renderTeacherCourseManage()}

            </main>

        </>

    );

}


/* =========================================================
   START REACT
========================================================= */

const root =
    createRoot(
        document.getElementById(
            "root"
        )
    );


root.render(
    <App />
);

</script>

</body>
</html>
