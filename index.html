<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshal: Your AI Friend</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Anshal: Your AI Friend
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message anshal-message">Hi there! I'm Anshal, your personal AI friend. How can I help you today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" class="chat-input" placeholder="Type your message...">
            <button id="send-button" class="send-button">
                <span id="send-button-text">Send</span>
                <div id="loading-spinner" class="loading-spinner hidden"></div>
            </button>
        </div>
    </div>
    <div id="user-id-display" class="user-id-display"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
