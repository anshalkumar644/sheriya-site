const getYouTubeId = (url) => {
    if (!url) return null;
    const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([^"&?\/\s]{11})/i;
    const match = url.match(regExp);
    return match ? match[1] : null;
};

const formatTime = (timeInSeconds) => {
    if (isNaN(timeInSeconds)) return "00:00";
    const m = Math.floor(timeInSeconds / 60).toString().padStart(2, '0');
    const s = Math.floor(timeInSeconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
};

const Toast = ({ message, type, onClose }) => {
    if (!message) return null;
    return (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] animate-fade-in flex items-center gap-2 px-5 py-2.5 rounded-full bg-emerald-600 text-white shadow-xl text-xs sm:text-sm font-bold border border-emerald-400">

            <span>{message}</span>
            <button onClick={onClose} className="ml-2 hover:opacity-80 p-0.5"><X className="h-3.5 w-3.5" /></button>
        </div>
    );
};

const CustomVideoPlayer = ({ video, allVideos, onSelectVideo, onBack }) => {
    const ytId = getYouTubeId(video.link);
    const containerId = `yt-player-${video.id}`;
    const playerRef = useRef(null);

    const [isPlaying, setIsPlaying] = useState(true);
    const [isMuted, setIsMuted] = useState(false);
    const [currentTimeSec, setCurrentTimeSec] = useState(0);
    const [durationSec, setDurationSec] = useState(1);
    
    const [playbackSpeed, setPlaybackSpeed] = useState("1.0x");
    const [videoQuality, setVideoQuality] = useState("Auto");
    const [showSettings, setShowSettings] = useState(false);
    const [settingsTab, setSettingsTab] = useState("menu");

    useEffect(() => {
        if (!ytId) return;

        const loadYTPlayer = () => {
            playerRef.current = new window.YT.Player(containerId, {
                videoId: ytId,
                playerVars: { autoplay: 1, controls: 0, modestbranding: 1, rel: 0, playsinline: 1, disablekb: 1 },
                events: {
                    onReady: (e) => {
                        setDurationSec(e.target.getDuration());
                        e.target.playVideo();
                    },
                    onStateChange: (e) => {
                        setIsPlaying(e.data === window.YT.PlayerState.PLAYING);
                    }
                }
            });
        };

        if (window.YT && window.YT.Player) {
            loadYTPlayer();
        } else {
            const originalReady = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
                if (originalReady) originalReady();
                loadYTPlayer();
            };
        }

        const interval = setInterval(() => {
            if (playerRef.current && playerRef.current.getCurrentTime) {
                const ct = playerRef.current.getCurrentTime();
                setCurrentTimeSec(ct);
            }
        }, 500);

        return () => {
            clearInterval(interval);
            if (playerRef.current && playerRef.current.destroy) {
                playerRef.current.destroy();
            }
        };
    }, [ytId, containerId]);

    const togglePlay = () => {
        if (!playerRef.current || !playerRef.current.getPlayerState) return;
        const state = playerRef.current.getPlayerState();
        if (state === window.YT.PlayerState.PLAYING) {
            playerRef.current.pauseVideo();
        } else {
            playerRef.current.playVideo();
        }
    };

    const toggleMute = () => {
        if (!playerRef.current) return;
        if (isMuted) playerRef.current.unMute();
        else playerRef.current.mute();
        setIsMuted(!isMuted);
    };

    const handleSeek = (e) => {
        if (!playerRef.current) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const percent = clickX / rect.width;
        const newTime = percent * durationSec;
        playerRef.current.seekTo(newTime, true);
        setCurrentTimeSec(newTime);
    };

    const toggleFullscreen = () => {
        const elem = document.getElementById("custom-video-wrapper");
        if (!elem) return;
        if (!document.fullscreenElement) elem.requestFullscreen?.();
        else document.exitFullscreen?.();
    };

    const handleSpeedSelect = (val, label) => {
        if (playerRef.current) playerRef.current.setPlaybackRate(val);
        setPlaybackSpeed(label);
        setShowSettings(false);
    };

    const progressPercent = durationSec > 0 ? (currentTimeSec / durationSec) * 100 : 0;

    return (
        <div className="space-y-6">
            <div className="grid lg:grid-cols-3 gap-6 items-start">
                {/* Left: Video Player + Details */}
                <div className="lg:col-span-2 space-y-4">
                    <div id="custom-video-wrapper" className="video-secure-container shadow-2xl relative group select-none border border-slate-900" onContextMenu={e => e.preventDefault()}>
                        <div className="shield-top-bar" title="Protected Player"></div>
                        <div className="shield-bottom-brand" title="Protected Player"></div>

                        <div className="relative pb-[56.25%] h-0 bg-black">
                            {ytId ? (
                                <div id={containerId} className="absolute inset-0 w-full h-full border-0 pointer-events-auto"></div>
                            ) : (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                                    <AlertCircle className="h-10 w-10 text-amber-400 mb-2" />
                                    <p className="font-bold text-sm">Video link invalid hai.</p>
                                </div>
                            )}
                        </div>

                        <div className="absolute top-3 left-3 z-30 flex items-center gap-2">
                            <button onClick={onBack} className="bg-black/60 hover:bg-black/80 text-white p-2 rounded-xl backdrop-blur-md transition">
                                <ArrowLeft className="h-4 w-4" />
                            </button>
                        </div>

                        {/* Settings Modal */}
                        {showSettings && (
                            <div className="absolute bottom-16 right-4 z-40 bg-slate-900/95 backdrop-blur-md text-white border border-slate-700/80 rounded-2xl shadow-2xl w-64 p-3 animate-fade-in text-xs font-semibold">
                                {settingsTab === "menu" && (
                                    <div className="space-y-1">
                                        <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 py-1 border-b border-slate-800">Video Settings</div>
                                        <button onClick={() => setSettingsTab("speed")} className="w-full flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-800 transition">
                                            <div className="flex items-center gap-2"><Sliders className="h-4 w-4 text-brand-400" /><span>Playback Speed</span></div>
                                            <span className="text-slate-400 font-bold">{playbackSpeed} ›</span>
                                        </button>
                                    </div>
                                )}
                                {settingsTab === "speed" && (
                                    <div className="space-y-1">
                                        <div className="flex items-center gap-2 px-1 py-1 border-b border-slate-800 mb-1">
                                            <button onClick={() => setSettingsTab("menu")} className="text-slate-400 hover:text-white p-1">‹</button>
                                            <span className="text-[11px] font-bold text-slate-300">Select Speed</span>
                                        </div>
                                        {[{l:'0.5x', v:0.5},{l:'0.75x', v:0.75},{l:'1.0x Normal', v:1.0},{l:'1.25x', v:1.25},{l:'1.5x', v:1.5},{l:'2.0x', v:2.0}].map(s => (
                                            <button key={s.l} onClick={() => handleSpeedSelect(s.v, s.l.replace(" Normal", ""))} className="w-full flex items-center justify-between p-2 rounded-xl transition hover:bg-slate-800 text-slate-300">
                                                <span>{s.l}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Custom Controls Bar */}
                        <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-3 pt-6 z-30">
                            <div className="w-full bg-slate-700/80 h-1.5 rounded-full mb-3 overflow-hidden cursor-pointer relative" onClick={handleSeek}>
                                <div className="bg-brand-500 h-full rounded-full relative" style={{ width: `${progressPercent}%` }}>
                                    <div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow"></div>
                                </div>
                            </div>

                            <div className="flex items-center justify-between text-white text-xs">
                                <div className="flex items-center gap-3">
                                    <button onClick={togglePlay} className="p-1 hover:text-brand-400 transition">
                                        {isPlaying ? <Pause className="h-5 w-5" /> : <Play className="h-5 w-5 fill-current" />}
                                    </button>
                                    <button onClick={toggleMute} className="p-1 hover:text-brand-400 transition">
                                        {isMuted ? <VolumeX className="h-4 w-4 text-rose-400" /> : <Volume2 className="h-4 w-4" />}
                                    </button>
                                    <span className="font-mono text-[11px] text-slate-300">
                                        {formatTime(currentTimeSec)} / {formatTime(durationSec)}
                                    </span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => {setShowSettings(true); setSettingsTab("speed");}} className="bg-white/10 hover:bg-white/20 px-2 py-0.5 rounded text-[11px] font-bold transition">
                                        {playbackSpeed}
                                    </button>
                                    <button onClick={() => {setShowSettings(!showSettings); setSettingsTab("menu");}} className="p-1 hover:text-brand-400 transition">
                                        <Settings className="h-4 w-4" />
                                    </button>
                                    <button onClick={toggleFullscreen} className="p-1 hover:text-brand-400 transition">
                                        <Maximize className="h-4 w-4" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl p-5 border border-indigo-100 shadow-soft-card space-y-3">
                        <div className="flex items-center justify-between">
                            <span className="text-[10px] font-extrabold uppercase tracking-wide bg-indigo-50 text-brand-600 px-3 py-1 rounded-full border border-indigo-100">
                                {video.subject || "LESSON"}
                            </span>
                        </div>
                        <h1 className="text-xl sm:text-2xl font-black text-slate-900 leading-snug">{video.title}</h1>
                    </div>
                </div>

                {/* Right: Course Content Playlist */}
                <div className="lg:col-span-1 bg-white rounded-3xl p-5 border border-indigo-100 shadow-soft-card space-y-4">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                        <div className="flex items-center gap-2 font-black text-sm text-slate-900">
                            <span className="w-1.5 h-4 bg-brand-600 rounded-full"></span>
                            <span>Playlist</span>
                        </div>
                    </div>
                    <div className="space-y-2.5 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                        {allVideos.map((item, idx) => {
                            const isCurrent = item.id === video.id;
                            const itemYtId = getYouTubeId(item.link);
                            const itemThumb = itemYtId ? `https://img.youtube.com/vi/${itemYtId}/hqdefault.jpg` : "https://via.placeholder.com/120x80";

                            return (
                                <div key={item.id} onClick={() => onSelectVideo(item)} className={`flex items-center gap-3 p-2.5 rounded-2xl cursor-pointer transition border ${isCurrent ? "bg-indigo-50/80 border-indigo-300" : "bg-white hover:bg-slate-50 border-slate-100"}`}>
                                    <div className="relative w-16 h-12 rounded-xl overflow-hidden bg-slate-900 shrink-0">
                                        <img src={itemThumb} alt="" className="w-full h-full object-cover" />
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <h4 className={`text-xs font-extrabold truncate ${isCurrent ? "text-brand-700" : "text-slate-800"}`}>{idx + 1}. {item.title}</h4>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        </div>
    );
};

function App() {
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);
    const [currentView, setCurrentView] = useState("home");

    /* Auth States */

    const [generatedOtp, setGeneratedOtp] = useState("3221");

    const [studentDetails, setStudentDetails] = useState({ name: "", email: "", fatherName: "", studentClass: "Class 10", newPassword: "" });
    const [loggedInStudentMobile, setLoggedInStudentMobile] = useState(null);

    /* Teacher States */
    const [teacherMobile, setTeacherMobile] = useState("");
    const [teacherPassword, setTeacherPassword] = useState("");
    const [isTeacherLoggedIn, setIsTeacherLoggedIn] = useState(false);
    const [teacherTab, setTeacherTab] = useState("courses");
    const [teacherCourseTab, setTeacherCourseTab] = useState("folders");
    const [selectedCourseForCommentFilter, setSelectedCourseForCommentFilter] = useState("all");
    const [courseToDelete, setCourseToDelete] = useState(null);
    const [uploadingImage, setUploadingImage] = useState(false);

    /* Firestore Collections */
    const [courses, setCourses] = useState([]);
    const [enrollments, setEnrollments] = useState([]);
    const [courseFolders, setCourseFolders] = useState([]);
    const [courseContents, setCourseContents] = useState([]);
    const [tests, setTests] = useState([]);
    const [testResults, setTestResults] = useState([]);
    const [comments, setComments] = useState([]);

    /* Creation States */
    const [newCourse, setNewCourse] = useState({ title: "", thumbnail: "", price: "", upiId: "", upiScanner: "", contactNumber: "" });
    const [newFolder, setNewFolder] = useState({ name: "" });
    const [newContent, setNewContent] = useState({ folderId: "", type: "class", subject: "", title: "", link: "", date: "", time: "" });
    
    /* Active States */
    const [activeCourseId, setActiveCourseId] = useState(null);
    const [activeFolderId, setActiveFolderId] = useState(null);
    const [contentTab, setContentTab] = useState("classes");
    const [activeVideo, setActiveVideo] = useState(null);
    const [activeTest, setActiveTest] = useState(null);
    const [selectedCourse, setSelectedCourse] = useState(null);
    
    const [isSubmitting, setIsSubmitting] = useState(false);
    const commentsEndRef = useRef(null);
    const [newComment, setNewComment] = useState("");

    /* Test Engine States */
    const [newTest, setNewTest] = useState({ title: "", duration: 15 });
    const [testQuestions, setTestQuestions] = useState([{ q: "", options: ["", "", "", ""], correctOption: 0 }]);
    const [testTimeLeft, setTestTimeLeft] = useState(0);
    const [studentAnswers, setStudentAnswers] = useState({});

    const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast({ message: "", type: "" }), 4000);
    };

    useEffect(() => {
        const savedStudent = localStorage.getItem("ssz_student_session");
        const savedTeacher = localStorage.getItem("ssz_teacher_session");
        if (savedTeacher === "true") { setIsTeacherLoggedIn(true); setCurrentView("teacher_dashboard"); } 
        else if (savedStudent) { setLoggedInStudentMobile(savedStudent); setCurrentView("student_dashboard"); }
    }, []);

    useEffect(() => {
        if (activeVideo && commentsEndRef.current) commentsEndRef.current.scrollIntoView({ behavior: "smooth" });
    }, [comments, activeVideo]);

    useEffect(() => {
        if (!auth) { setLoading(false); return; }
        const unsub = onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); });
        signInAnonymously(auth).catch(err => console.error(err));
        return () => unsub();
    }, []);

    useEffect(() => {
        if (!user || !db) return;
        const unsubs = [];
        const cols = [
            { path: "courses", setter: setCourses },
            { path: "enrollments", setter: setEnrollments },
            { path: "course_folders", setter: setCourseFolders },
            { path: "course_contents", setter: setCourseContents },
            { path: "tests", setter: setTests },
            { path: "test_results", setter: setTestResults }
        ];

        cols.forEach(c => {
            const ref = collection(db, "artifacts", appId, "public", "data", c.path);
            unsubs.push(onSnapshot(ref, snap => c.setter(snap.docs.map(d => ({ id: d.id, ...d.data() })))));
        });

        const commRef = collection(db, "artifacts", appId, "public", "data", "comments");
        unsubs.push(onSnapshot(commRef, snap => {
            const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            data.sort((a, b) => (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0));
            setComments(data);
        }));

        const studRef = collection(db, "artifacts", appId, "public", "data", "students");
        unsubs.push(onSnapshot(studRef, snap => {
            if (loggedInStudentMobile) {
                const s = snap.docs.find(d => d.id === loggedInStudentMobile);
                if (s) setStudentDetails(s.data());
            }
        }));

        return () => unsubs.forEach(fn => fn());
    }, [user, loggedInStudentMobile]);

    const handleStudentLogin = async (e) => {
        e.preventDefault();
        if (!db) return;
        setIsSubmitting(true);
        try {
            const authDoc = await getDoc(doc(db, "artifacts", appId, "public", "data", "students_auth", mobile));
            if (authDoc.exists() && authDoc.data().password === password) {
                localStorage.setItem("ssz_student_session", mobile);
                setLoggedInStudentMobile(mobile);
                setCurrentView("student_dashboard");
                showToast("Welcome Back! Login safal raha.");
            } else {
                showToast("Mobile number ya password galat hai.", "error");
            }
        } catch (err) { showToast("Error: " + err.message, "error"); }
        setIsSubmitting(false);
    };

    const handleSendOtp = (e) => {
        e.preventDefault();
        if (!/^\d{10}$/.test(mobile)) { showToast("Valid 10-digit number dalein.", "error"); return; }
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        setGeneratedOtp(code);
        setCurrentView("verify_otp");
        showToast("Demo OTP generate ho gaya!");
    };

    const handleVerifyOtp = (e) => {
        e.preventDefault();
        if (otp === generatedOtp || otp === "3221" || otp === "1234") {
            setCurrentView("student_details");

        setUploadingImage(true);
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                const scale = Math.min(1, 700 / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                setNewCourse(prev => ({ ...prev, [fieldName]: canvas.toDataURL("image/jpeg", 0.65) }));
                setUploadingImage(false);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

            </main>
        </div>
    );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

</script>
