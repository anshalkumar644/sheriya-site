const getYouTubeId = (url) => {
    if (!url) return null;
    const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([^"&?\/\s]{11})/i;
    const match = url.match(regExp); return match ? match[1] : null;
};

const formatTime = (timeInSeconds) => {
    if (isNaN(timeInSeconds)) return "00:00";
    const m = Math.floor(timeInSeconds / 60).toString().padStart(2, '0');
    const s = Math.floor(timeInSeconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
};

const Toast = ({ message, type, onClose }) => {

    return (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[9999] animate-fade-in flex items-center gap-2 px-5 py-2.5 rounded-full text-white shadow-xl text-xs sm:text-sm font-bold border print-hide ${type === 'error' ? 'bg-rose-600 border-rose-400' : 'bg-emerald-600 border-emerald-400'}`}>

    );
};

const CustomVideoPlayer = ({ video, allVideos, onSelectVideo, onBack }) => {
    const ytId = getYouTubeId(video.link);
    const containerId = `yt-player-${video.id}`;
    const playerRef = useRef(null);

    const [isPlaying, setIsPlaying] = useState(true);
    const [isMuted, setIsMuted] = useState(false);
    const [currentTimeSec, setCurrentTimeSec] = useState(0);
    const [durationSec, setDurationSec] = useState(1);
    const [playbackSpeed, setPlaybackSpeed] = useState("1.0x");
    const [showSettings, setShowSettings] = useState(false);
    const [settingsTab, setSettingsTab] = useState("menu");

    useEffect(() => {
        if (!ytId) return;
        const loadYTPlayer = () => {
            playerRef.current = new window.YT.Player(containerId, {
                videoId: ytId,
                playerVars: { autoplay: 1, controls: 0, modestbranding: 1, rel: 0, playsinline: 1, disablekb: 1 },
                events: {
                    onReady: (e) => { setDurationSec(e.target.getDuration()); e.target.playVideo(); },
                    onStateChange: (e) => { setIsPlaying(e.data === window.YT.PlayerState.PLAYING); }
                }
            });
        };
        if (window.YT && window.YT.Player) loadYTPlayer();
        else { const originalReady = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (originalReady) originalReady(); loadYTPlayer(); }; }
        const interval = setInterval(() => { if (playerRef.current && playerRef.current.getCurrentTime) setCurrentTimeSec(playerRef.current.getCurrentTime()); }, 500);
        return () => { clearInterval(interval); if (playerRef.current?.destroy) playerRef.current.destroy(); };
    }, [ytId, containerId]);

    const togglePlay = () => {
        if (!playerRef.current?.getPlayerState) return;
        if (playerRef.current.getPlayerState() === window.YT.PlayerState.PLAYING) playerRef.current.pauseVideo();
        else playerRef.current.playVideo();
    };

    const toggleMute = () => {
        if (!playerRef.current) return;
        if (isMuted) playerRef.current.unMute(); else playerRef.current.mute();
        setIsMuted(!isMuted);
    };

    const handleSeek = (e) => {
        if (!playerRef.current) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const newTime = ((e.clientX - rect.left) / rect.width) * durationSec;
        playerRef.current.seekTo(newTime, true); setCurrentTimeSec(newTime);
    };

    const toggleFullscreen = () => {
        const elem = document.getElementById("custom-video-wrapper");
        if (!elem) return;
        if (!document.fullscreenElement) elem.requestFullscreen?.();
        else document.exitFullscreen?.();
    };

    const handleSpeedSelect = (val, label) => {
        if (playerRef.current) playerRef.current.setPlaybackRate(val);
        setPlaybackSpeed(label); setShowSettings(false);
    };

    const progressPercent = durationSec > 0 ? (currentTimeSec / durationSec) * 100 : 0;

    return (
        <div className="space-y-6">
            <div className="grid lg:grid-cols-3 gap-6 items-start">
                <div className="lg:col-span-2 space-y-4">
                    <div id="custom-video-wrapper" className="video-secure-container shadow-2xl relative group select-none border border-slate-900" onContextMenu={e => e.preventDefault()}>
                        <div className="shield-top-bar" title="Protected Player"></div><div className="shield-bottom-brand" title="Protected Player"></div>
                        <div className="relative pb-[56.25%] h-0 bg-black">
                            {ytId ? <div id={containerId} className="absolute inset-0 w-full h-full border-0 pointer-events-auto"></div> : (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400"><AlertCircle className="h-10 w-10 text-amber-400 mb-2" /><p className="font-bold text-sm">Video link invalid hai.</p></div>
                            )}
                        </div>
                        <div className="absolute top-3 left-3 z-30 flex items-center gap-2"><button onClick={onBack} className="bg-black/60 hover:bg-black/80 text-white p-2 rounded-xl backdrop-blur-md transition"><ArrowLeft className="h-4 w-4" /></button></div>
                        {showSettings && (
                            <div className="absolute bottom-16 right-4 z-40 bg-slate-900/95 backdrop-blur-md text-white border border-slate-700/80 rounded-2xl shadow-2xl w-64 p-3 animate-fade-in text-xs font-semibold">
                                {settingsTab === "menu" && (
                                    <div className="space-y-1">
                                        <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 py-1 border-b border-slate-800">Video Settings</div>
                                        <button onClick={() => setSettingsTab("speed")} className="w-full flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-800 transition">
                                            <div className="flex items-center gap-2"><Sliders className="h-4 w-4 text-brand-400" /><span>Playback Speed</span></div><span className="text-slate-400 font-bold">{playbackSpeed} ›</span>
                                        </button>
                                    </div>
                                )}
                                {settingsTab === "speed" && (
                                    <div className="space-y-1">
                                        <div className="flex items-center gap-2 px-1 py-1 border-b border-slate-800 mb-1"><button onClick={() => setSettingsTab("menu")} className="text-slate-400 hover:text-white p-1">‹</button><span className="text-[11px] font-bold text-slate-300">Select Speed</span></div>
                                        {[{l:'0.5x', v:0.5},{l:'0.75x', v:0.75},{l:'1.0x Normal', v:1.0},{l:'1.25x', v:1.25},{l:'1.5x', v:1.5},{l:'2.0x', v:2.0}].map(s => (
                                            <button key={s.l} onClick={() => handleSpeedSelect(s.v, s.l.replace(" Normal", ""))} className="w-full flex items-center justify-between p-2 rounded-xl transition hover:bg-slate-800 text-slate-300"><span>{s.l}</span></button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                        <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-3 pt-6 z-30">
                            <div className="w-full bg-slate-700/80 h-1.5 rounded-full mb-3 overflow-hidden cursor-pointer relative" onClick={handleSeek}>
                                <div className="bg-brand-500 h-full rounded-full relative" style={{ width: `${progressPercent}%` }}><div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow"></div></div>
                            </div>
                            <div className="flex items-center justify-between text-white text-xs">
                                <div className="flex items-center gap-3">
                                    <button onClick={togglePlay} className="p-1 hover:text-brand-400 transition">{isPlaying ? <Pause className="h-5 w-5" /> : <Play className="h-5 w-5 fill-current" />}</button>
                                    <button onClick={toggleMute} className="p-1 hover:text-brand-400 transition">{isMuted ? <VolumeX className="h-4 w-4 text-rose-400" /> : <Volume2 className="h-4 w-4" />}</button>
                                    <span className="font-mono text-[11px] text-slate-300">{formatTime(currentTimeSec)} / {formatTime(durationSec)}</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => {setShowSettings(true); setSettingsTab("speed");}} className="bg-white/10 hover:bg-white/20 px-2 py-0.5 rounded text-[11px] font-bold transition">{playbackSpeed}</button>
                                    <button onClick={() => {setShowSettings(!showSettings); setSettingsTab("menu");}} className="p-1 hover:text-brand-400 transition"><Settings className="h-4 w-4" /></button>
                                    <button onClick={toggleFullscreen} className="p-1 hover:text-brand-400 transition"><Maximize className="h-4 w-4" /></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="bg-white rounded-3xl p-5 border border-indigo-100 shadow-soft-card space-y-3">
                        <span className="text-[10px] font-extrabold uppercase tracking-wide bg-indigo-50 text-brand-600 px-3 py-1 rounded-full border border-indigo-100">{video.subject || "LESSON"}</span>
                        <h1 className="text-xl sm:text-2xl font-black text-slate-900 leading-snug">{video.title}</h1>
                    </div>
                </div>
                <div className="lg:col-span-1 bg-white rounded-3xl p-5 border border-indigo-100 shadow-soft-card space-y-4">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-100"><div className="flex items-center gap-2 font-black text-sm text-slate-900"><span className="w-1.5 h-4 bg-brand-600 rounded-full"></span><span>Course Playlist</span></div></div>
                    <div className="space-y-2.5 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                        {allVideos.map((item, idx) => {
                            const isCurrent = item.id === video.id;
                            const itemYtId = getYouTubeId(item.link);
                            const itemThumb = itemYtId ? `https://img.youtube.com/vi/${itemYtId}/hqdefault.jpg` : "https://via.placeholder.com/120x80";
                            return (
                                <div key={item.id} onClick={() => onSelectVideo(item)} className={`flex items-center gap-3 p-2.5 rounded-2xl cursor-pointer transition border ${isCurrent ? "bg-indigo-50/80 border-indigo-300" : "bg-white hover:bg-slate-50 border-slate-100"}`}>
                                    <div className="relative w-16 h-12 rounded-xl overflow-hidden bg-slate-900 shrink-0"><img src={itemThumb} alt="" className="w-full h-full object-cover" /></div>
                                    <div className="flex-1 min-w-0"><h4 className={`text-xs font-extrabold truncate ${isCurrent ? "text-brand-700" : "text-slate-800"}`}>{idx + 1}. {item.title}</h4></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        </div>
    );
};

                const canvas = document.createElement("canvas"); const scale = Math.min(1, 700 / img.width);

            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

                                                            <div key={optIdx} className="flex items-center gap-2">
                                                                <input type="radio" name={`correct-${idx}`} checked={q.correctOption === optIdx} onChange={() => handleQuestionChange(idx, 'correctOption', optIdx)} />
                                                                <input type="text" placeholder={`Option ${optIdx + 1}`} value={opt} onChange={e => handleQuestionChange(idx, 'opt', e.target.value, optIdx)} className="w-full border rounded-xl py-1.5 px-3 text-xs outline-none focus:border-portal-blue" />
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-3"><button onClick={() => setTestQuestions([...testQuestions, {q:'', options:['','','',''], correctOption:0}])} className="bg-slate-200 text-slate-700 hover:bg-slate-300 transition text-xs font-bold px-4 py-2 rounded-xl">Add Question</button><button onClick={handleCreateTest} disabled={isSubmitting} className="bg-emerald-600 hover:bg-emerald-700 transition text-white text-xs font-bold px-6 py-2 rounded-xl">Publish Test</button></div>
                                    </div>
                                )}
                            </div>
                        );
                    })()}

                </div>

                {/* Account Deletion Modal */}
                {showDeleteModal && (
                    <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 animate-fade-in text-center">
                            <div className="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-2"><UserMinus className="h-8 w-8"/></div>
                            <h3 className="font-bubble text-xl font-bold text-slate-900">Delete Account?</h3>
                            <p className="text-xs text-slate-500 font-semibold mb-4">Aapka account aur saara data permanently delete ho jayega. Yeh process reverse nahi kiya jaa sakta.</p>
                            <form onSubmit={handleDeleteAccount} className="space-y-4 text-left">
                                <div>
                                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Enter Password to Confirm</label>
                                    <input type="password" required value={deletePassInput} onChange={e => setDeletePassInput(e.target.value)} className="w-full bg-slate-50 border border-slate-200 focus:border-rose-400 rounded-xl py-2.5 px-4 text-xs font-bold outline-none" placeholder="Your Password" />
                                </div>
                                <div className="flex gap-3 pt-2">
                                    <button type="button" onClick={() => { setShowDeleteModal(false); setDeletePassInput(""); }} className="flex-1 py-3 border rounded-xl text-xs font-bold text-slate-600">Cancel</button>
                                    <button type="submit" disabled={isSubmitting} className="flex-1 py-3 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-bold disabled:opacity-50">Permanently Delete</button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                {loggedInStudentMobile && !isTeacherLoggedIn && currentView !== "student_video_player" && currentView !== "take_test" && currentView !== "payment_page" && currentView !== "receipt_view" && currentView !== "refund_form" && (
                    <>
                        {/* Direct Teacher Chat Button */}
                        <button onClick={() => setShowTeacherChat(true)} className="fixed bottom-6 right-6 w-14 h-14 bg-portal-blue text-white rounded-full shadow-glow-purple flex items-center justify-center hover:scale-105 transition z-40 print-hide" title="Chat with Teacher">
                            <MessageSquare className="h-6 w-6" />
                        </button>

                        {/* AI Bot Button */}
                        <button onClick={() => setShowAiBot(true)} className="fixed bottom-6 left-6 w-14 h-14 bg-gradient-to-r from-amber-400 to-rose-500 text-white rounded-full shadow-xl flex items-center justify-center hover:scale-105 transition z-40 print-hide" title="AI Coaching Guide">
                            <Bot className="h-6 w-6" />
                        </button>

                        {/* AI Bot Chat Window */}
                        {showAiBot && (
                            <div className="fixed bottom-20 sm:bottom-24 left-4 sm:left-6 w-[calc(100vw-32px)] sm:w-96 bg-white rounded-3xl shadow-2xl border border-slate-200 flex flex-col h-[60vh] sm:h-[500px] z-50 animate-fade-in overflow-hidden print-hide">
                                <div className="p-4 bg-gradient-to-r from-amber-400 to-rose-500 text-white flex justify-between items-center shrink-0">
                                    <div><h3 className="font-bubble font-bold text-sm">AI Coaching Guide</h3><p className="text-[10px] text-white/80">Powered by Anshal Kumar</p></div>
                                    <button onClick={() => setShowAiBot(false)} className="text-white/80 hover:text-white"><X className="h-5 w-5"/></button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3 bg-slate-50">
                                    {aiMessages.map((m, idx) => (
                                        <div key={idx} className={`flex flex-col ${m.role === 'user' ? "items-end" : "items-start"}`}>
                                            <div className={`px-4 py-2.5 rounded-2xl text-xs font-semibold max-w-[85%] break-words ${m.role === 'user' ? "bg-portal-blue text-white rounded-tr-none" : "bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm"}`}>{m.text}</div>
                                        </div>
                                    ))}
                                    {aiLoading && <div className="flex items-center gap-1.5 text-xs text-slate-400 p-2"><div className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></div><div className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:"0.2s"}}></div><div className="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:"0.4s"}}></div></div>}
                                    <div ref={aiChatEndRef} />
                                </div>
                                <form onSubmit={handleAiSubmit} className="p-3 border-t bg-white flex gap-2 shrink-0">
                                    <input type="text" value={aiInput} onChange={e => setAiInput(e.target.value)} placeholder="Ask anything about coaching..." className="flex-1 border rounded-2xl px-4 py-2 text-xs outline-none focus:border-rose-400 bg-slate-50" />
                                    <button type="submit" disabled={!aiInput.trim() || aiLoading} className="w-10 h-10 bg-rose-500 text-white rounded-2xl flex justify-center items-center shadow-md disabled:opacity-50"><Send className="h-4 w-4"/></button>
                                </form>
                            </div>
                        )}

                        {/* Teacher Chat Window */}
                        {showTeacherChat && (
                            <div className="fixed bottom-20 sm:bottom-24 right-4 sm:right-6 w-[calc(100vw-32px)] sm:w-96 bg-white rounded-3xl shadow-2xl border border-slate-200 flex flex-col h-[60vh] sm:h-[500px] z-50 animate-fade-in overflow-hidden print-hide">
                                <div className="p-4 bg-portal-blue text-white flex justify-between items-center shrink-0">
                                    <div><h3 className="font-bubble font-bold text-sm">Direct Contact Teacher</h3><p className="text-[10px] text-indigo-100">Hum aapki madad ke liye hazir hain</p></div>
                                    <button onClick={() => setShowTeacherChat(false)} className="text-white/80 hover:text-white"><X className="h-5 w-5"/></button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-3 bg-slate-50">
                                    <div className="bg-white p-3 rounded-xl border shadow-sm text-center space-y-2 mb-4 shrink-0">
                                        <p className="text-[11px] font-bold text-slate-500">Need urgent help?</p>
                                        <button onClick={requestCall} className="bg-emerald-100 text-emerald-700 border border-emerald-200 text-[11px] font-bold px-4 py-2 rounded-lg flex items-center justify-center gap-1.5 w-full hover:bg-emerald-200 transition"><PhoneCall className="h-3.5 w-3.5"/> Request a Call Back</button>
                                    </div>
                                    {directMessages.filter(m => m.studentId === loggedInStudentMobile).map(m => {
                                        const isMe = m.sender === "student";
                                        return (
                                            <div key={m.id} className={`flex flex-col ${isMe ? "items-end" : "items-start"}`}>
                                                <div className={`px-4 py-2.5 rounded-2xl text-xs font-semibold max-w-[85%] break-words ${isMe ? "bg-portal-blue text-white rounded-tr-none" : "bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm"}`}>{m.text}</div>
                                                <span className="text-[9px] font-bold text-slate-400 mt-0.5 px-1">{m.timeString}</span>
                                            </div>
                                        );
                                    })}
                                    <div ref={directChatEndRef} />
                                </div>
                                <form onSubmit={(e) => sendDirectMessage(e, null)} className="p-3 border-t bg-white flex gap-2 shrink-0">
                                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Type a message..." className="flex-1 border rounded-2xl px-4 py-2 text-xs outline-none focus:border-portal-blue bg-slate-50" />
                                    <button type="submit" disabled={!chatInput.trim()} className="w-10 h-10 bg-portal-blue text-white rounded-2xl flex justify-center items-center shadow-md"><Send className="h-4 w-4"/></button>
                                </form>
                            </div>
                        )}
                    </>
                )}
            </main>

            <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs font-bold text-slate-400 select-none shrink-0 z-40 print-hide">
                <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <span className="flex items-center gap-1.5 text-portal-blue"><BookOpen className="h-4 w-4" /> Sheriya Study Zone</span>
                    <span>© {new Date().getFullYear()} • Developed for better education</span>
                </div>
            </footer>
        </div>
    );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
