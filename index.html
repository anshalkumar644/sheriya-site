/* =========================================================
   YOUTUBE EXTRACTOR HELPER
========================================================= */
const getYouTubeId = (url) => {
    if (!url) return null;
    const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([^"&?\/\s]{11})/i;
    const match = url.match(regExp);
    return match ? match[1] : null;
};

/* =========================================================
   TOAST NOTIFICATION (MATCHING DESIGN 1000002309)
========================================================= */
const Toast = ({ message, type, onClose }) => {
    if (!message) return null;
    return (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] animate-fade-in flex items-center gap-2 px-5 py-2.5 rounded-full bg-emerald-600 text-white shadow-xl text-xs sm:text-sm font-bold border border-emerald-400">
            <CheckCircle className="h-4 w-4 shrink-0 text-white" />
            <span>{message}</span>
            <button onClick={onClose} className="ml-2 hover:opacity-80 p-0.5">
                <X className="h-3.5 w-3.5" />
            </button>
        </div>
    );
};

/* =========================================================
   CUSTOM VIDEO PLAYER WITH QUALITY & SPEED CONTROLS
========================================================= */
const CustomVideoPlayer = ({ video, allVideos, onSelectVideo, onBack }) => {
    const ytId = getYouTubeId(video.link);
    const iframeRef = useRef(null);
    const playerRef = useRef(null);

    const [isPlaying, setIsPlaying] = useState(true);
    const [isMuted, setIsMuted] = useState(false);
    const [currentTime, setCurrentTime] = useState("04:32");
    const [totalDuration, setTotalDuration] = useState("12:56");
    const [playbackSpeed, setPlaybackSpeed] = useState("1.0x");
    const [videoQuality, setVideoQuality] = useState("720p HD");
    const [showSettings, setShowSettings] = useState(false);
    const [settingsTab, setSettingsTab] = useState("menu"); // 'menu' | 'speed' | 'quality'
    const [likesCount, setLikesCount] = useState(1240);
    const [isLiked, setIsLiked] = useState(false);
    const [isSaved, setIsSaved] = useState(false);
    const [isCompleted, setIsCompleted] = useState(false);

    const speeds = [
        { label: "0.5x", val: 0.5 },
        { label: "0.75x", val: 0.75 },
        { label: "1.0x Normal", val: 1.0 },
        { label: "1.25x", val: 1.25 },
        { label: "1.5x", val: 1.5 },
        { label: "2.0x", val: 2.0 }
    ];

    const qualities = ["1080p Full HD", "720p HD", "480p SD", "360p Low", "Auto (Recommended)"];

    const handleSpeedSelect = (speedObj) => {
        setPlaybackSpeed(speedObj.label.replace(" Normal", ""));
        setShowSettings(false);
        setSettingsTab("menu");
        if (iframeRef.current && iframeRef.current.contentWindow) {
            iframeRef.current.contentWindow.postMessage(
                JSON.stringify({ event: "command", func: "setPlaybackRate", args: [speedObj.val] }),
                "*"
            );
        }
    };

    const handleQualitySelect = (q) => {
        setVideoQuality(q);
        setShowSettings(false);
        setSettingsTab("menu");
    };

    const togglePlay = () => {
        if (!iframeRef.current) return;
        const action = isPlaying ? "pauseVideo" : "playVideo";
        iframeRef.current.contentWindow?.postMessage(
            JSON.stringify({ event: "command", func: action, args: [] }),
            "*"
        );
        setIsPlaying(!isPlaying);
    };

    const toggleMute = () => {
        if (!iframeRef.current) return;
        const action = isMuted ? "unMute" : "mute";
        iframeRef.current.contentWindow?.postMessage(
            JSON.stringify({ event: "command", func: action, args: [] }),
            "*"
        );
        setIsMuted(!isMuted);
    };

    const toggleFullscreen = () => {
        const elem = document.getElementById("custom-video-wrapper");
        if (!elem) return;
        if (!document.fullscreenElement) {
            elem.requestFullscreen?.().catch(err => console.log(err));
        } else {
            document.exitFullscreen?.();
        }
    };

    return (
        <div className="space-y-6">
            <div className="grid lg:grid-cols-3 gap-6 items-start">
                {/* Left: Video Player + Details (Screenshots 1000002314 & 1000002313) */}
                <div className="lg:col-span-2 space-y-4">
                    {/* Video Player Container */}
                    <div
                        id="custom-video-wrapper"
                        className="video-secure-container shadow-2xl relative group select-none border border-slate-900"
                        onContextMenu={(e) => e.preventDefault()}
                    >
                        {/* Top shield: Blocks clicking on YouTube title, avatar, and share button */}
                        <div className="shield-top-bar" title="Protected Player"></div>
                        {/* Bottom-right shield: Blocks 'Watch on YouTube' logo click */}
                        <div className="shield-bottom-brand" title="Protected Player"></div>

                        {/* Video Frame */}
                        <div className="relative pb-[56.25%] h-0 bg-black">
                            {ytId ? (
                                <iframe
                                    ref={iframeRef}
                                    src={`https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&enablejsapi=1&controls=0&modestbranding=1&rel=0&fs=0&playsinline=1&iv_load_policy=3&disablekb=1`}
                                    title={video.title}
                                    className="absolute inset-0 w-full h-full border-0 pointer-events-auto"
                                    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
                                    allowFullScreen
                                />
                            ) : (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                                    <AlertCircle className="h-10 w-10 text-amber-400 mb-2" />
                                    <p className="font-bold text-sm">Video link invalid hai.</p>
                                </div>
                            )}
                        </div>

                        {/* Top bar inside player */}
                        <div className="absolute top-3 left-3 z-30 flex items-center gap-2">
                            <button
                                onClick={onBack}
                                className="bg-black/60 hover:bg-black/80 text-white p-2 rounded-xl backdrop-blur-md transition"
                                title="Back"
                            >
                                <ArrowLeft className="h-4 w-4" />
                            </button>
                        </div>

                        {/* SETTINGS POPUP MODAL (Working Quality & Speed Option) */}
                        {showSettings && (
                            <div className="absolute bottom-16 right-4 z-40 bg-slate-900/95 backdrop-blur-md text-white border border-slate-700/80 rounded-2xl shadow-2xl w-64 p-3 animate-fade-in text-xs font-semibold">
                                {settingsTab === "menu" && (
                                    <div className="space-y-1">
                                        <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2 py-1 border-b border-slate-800">
                                            Video Settings
                                        </div>
                                        {/* Speed Option */}
                                        <button
                                            onClick={() => setSettingsTab("speed")}
                                            className="w-full flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-800 transition"
                                        >
                                            <div className="flex items-center gap-2">
                                                <Sliders className="h-4 w-4 text-brand-400" />
                                                <span>Playback Speed</span>
                                            </div>
                                            <span className="text-slate-400 font-bold">{playbackSpeed} ›</span>
                                        </button>

                                        {/* Quality Option */}
                                        <button
                                            onClick={() => setSettingsTab("quality")}
                                            className="w-full flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-800 transition"
                                        >
                                            <div className="flex items-center gap-2">
                                                <Sparkles className="h-4 w-4 text-amber-400" />
                                                <span>Video Quality</span>
                                            </div>
                                            <span className="text-slate-400 font-bold">{videoQuality} ›</span>
                                        </button>
                                    </div>
                                )}

                                {settingsTab === "speed" && (
                                    <div className="space-y-1">
                                        <div className="flex items-center gap-2 px-1 py-1 border-b border-slate-800 mb-1">
                                            <button onClick={() => setSettingsTab("menu")} className="text-slate-400 hover:text-white p-1">
                                                ‹
                                            </button>
                                            <span className="text-[11px] font-bold text-slate-300">Select Speed</span>
                                        </div>
                                        {speeds.map((s) => (
                                            <button
                                                key={s.label}
                                                onClick={() => handleSpeedSelect(s)}
                                                className={`w-full flex items-center justify-between p-2 rounded-xl transition ${
                                                    playbackSpeed === s.label.replace(" Normal", "") ? "bg-brand-600 text-white font-bold" : "hover:bg-slate-800 text-slate-300"
                                                }`}
                                            >
                                                <span>{s.label}</span>
                                                {playbackSpeed === s.label.replace(" Normal", "") && <Check className="h-3.5 w-3.5" />}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {settingsTab === "quality" && (
                                    <div className="space-y-1">
                                        <div className="flex items-center gap-2 px-1 py-1 border-b border-slate-800 mb-1">
                                            <button onClick={() => setSettingsTab("menu")} className="text-slate-400 hover:text-white p-1">
                                                ‹
                                            </button>
                                            <span className="text-[11px] font-bold text-slate-300">Select Quality</span>
                                        </div>
                                        {qualities.map((q) => (
                                            <button
                                                key={q}
                                                onClick={() => handleQualitySelect(q)}
                                                className={`w-full flex items-center justify-between p-2 rounded-xl transition ${
                                                    videoQuality === q ? "bg-brand-600 text-white font-bold" : "hover:bg-slate-800 text-slate-300"
                                                }`}
                                            >
                                                <span>{q}</span>
                                                {videoQuality === q && <Check className="h-3.5 w-3.5" />}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* CUSTOM CONTROLS BAR (Matches screenshot 1000002314) */}
                        <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 via-black/60 to-transparent p-3 pt-6 z-30">
                            {/* Scrubber Progress Bar */}
                            <div className="w-full bg-slate-700/80 h-1.5 rounded-full mb-3 overflow-hidden cursor-pointer relative">
                                <div className="bg-brand-500 h-full w-[42%] rounded-full relative">
                                    <div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow"></div>
                                </div>
                            </div>

                            <div className="flex items-center justify-between text-white text-xs">
                                {/* Left Controls */}
                                <div className="flex items-center gap-3">
                                    <button onClick={togglePlay} className="p-1 hover:text-brand-400 transition">
                                        {isPlaying ? <Pause className="h-5 w-5" /> : <Play className="h-5 w-5 fill-current" />}
                                    </button>
                                    <button className="p-1 hover:text-brand-400 transition">
                                        <SkipForward className="h-4 w-4" />
                                    </button>
                                    <button onClick={toggleMute} className="p-1 hover:text-brand-400 transition">
                                        {isMuted ? <VolumeX className="h-4 w-4 text-rose-400" /> : <Volume2 className="h-4 w-4" />}
                                    </button>
                                    <span className="font-mono text-[11px] text-slate-300">
                                        {currentTime} / {totalDuration}
                                    </span>
                                </div>

                                {/* Right Controls */}
                                <div className="flex items-center gap-3">
                                    {/* Speed Quick Pill */}
                                    <button
                                        onClick={() => {
                                            setShowSettings(true);
                                            setSettingsTab("speed");
                                        }}
                                        className="bg-white/10 hover:bg-white/20 px-2 py-0.5 rounded text-[11px] font-bold transition"
                                    >
                                        {playbackSpeed}
                                    </button>

                                    {/* Settings Gear Button */}
                                    <button
                                        onClick={() => {
                                            setShowSettings(!showSettings);
                                            setSettingsTab("menu");
                                        }}
                                        className={`p-1 transition rounded-lg ${showSettings ? "text-brand-400 bg-white/10" : "hover:text-brand-400"}`}
                                        title="Video Settings (Quality & Speed)"
                                    >
                                        <Settings className="h-4 w-4" />
                                    </button>

                                    {/* Fullscreen Button */}
                                    <button onClick={toggleFullscreen} className="p-1 hover:text-brand-400 transition">
                                        <Maximize className="h-4 w-4" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Lesson Info Card (Screenshot 1000002314) */}
                    <div className="bg-white rounded-3xl p-5 border border-indigo-100 shadow-soft-card space-y-3">
                        <div className="flex items-center justify-between">
                            <span className="text-[10px] font-extrabold uppercase tracking-wide bg-indigo-50 text-brand-600 px-3 py-1 rounded-full border border-indigo-100">
                                {video.subject || "SHUBH UDGHAATAN"}
                            </span>

                            <div className="flex items-center gap-3 text-slate-600 text-xs font-bold">
                                <button
                                    onClick={() => {
                                        setIsLiked(!isLiked);
                                        setLikesCount(prev => isLiked ? prev - 1 : prev + 1);
                                    }}
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition ${
                                        isLiked ? "bg-brand-50 border-brand-300 text-brand-600" : "border-slate-200 hover:bg-slate-50"
                                    }`}
                                >
                                    <ThumbsUp className="h-3.5 w-3.5" />
                                    <span>{likesCount}</span>
                                </button>
                                <button
                                    onClick={() => setIsSaved(!isSaved)}
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition ${
                                        isSaved ? "bg-emerald-50 border-emerald-300 text-emerald-600" : "border-slate-200 hover:bg-slate-50"
                                    }`}
                                >
                                    <Bookmark className="h-3.5 w-3.5" />
                                    <span>{isSaved ? "Saved" : "Save"}</span>
                                </button>
                            </div>
                        </div>

                        <h1 className="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
                            {video.title}
                        </h1>

                        <div className="flex flex-wrap items-center justify-between border-t border-slate-100 pt-4 gap-3">
                            <button className="flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-slate-800">
                                <ArrowLeft className="h-3.5 w-3.5" />
                                <span>Previous Lesson</span>
                            </button>

                            <button
                                onClick={() => setIsCompleted(!isCompleted)}
                                className={`flex items-center gap-2 px-4 py-2 rounded-2xl text-xs font-black transition ${
                                    isCompleted
                                        ? "bg-emerald-500 text-white shadow-glow-green"
                                        : "bg-indigo-50 text-brand-700 hover:bg-indigo-100"
                                }`}
                            >
                                <CheckCircle className="h-4 w-4" />
                                <span>{isCompleted ? "Completed ✓" : "Mark as Complete"}</span>
                            </button>

                            <button className="flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-slate-800">
                                <span>Next Lesson</span>
                                <ChevronRight className="h-3.5 w-3.5" />
                            </button>
                        </div>
                    </div>
                </div>

                {/* Right: Course Content Playlist (Screenshot 1000002314) */}
                <div className="lg:col-span-1 bg-white rounded-3xl p-5 border border-indigo-100 shadow-soft-card space-y-4">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                        <div className="flex items-center gap-2 font-black text-sm text-slate-900">
                            <span className="w-1.5 h-4 bg-brand-600 rounded-full"></span>
                            <span>Course Content</span>
                        </div>
                        <span className="text-xs font-bold text-slate-400">Hide</span>
                    </div>

                    <div className="space-y-2.5 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                        {allVideos.map((item, idx) => {
                            const isCurrent = item.id === video.id;
                            const itemYtId = getYouTubeId(item.link);
                            const itemThumb = itemYtId
                                ? `https://img.youtube.com/vi/${itemYtId}/hqdefault.jpg`
                                : "https://via.placeholder.com/120x80?text=Sheriya";

                            return (
                                <div
                                    key={item.id || idx}
                                    onClick={() => onSelectVideo(item)}
                                    className={`flex items-center gap-3 p-2.5 rounded-2xl cursor-pointer transition border ${
                                        isCurrent
                                            ? "bg-indigo-50/80 border-indigo-300 shadow-sm"
                                            : "bg-white hover:bg-slate-50 border-slate-100"
                                    }`}
                                >
                                    <div className="relative w-16 h-12 rounded-xl overflow-hidden bg-slate-900 shrink-0">
                                        <img src={itemThumb} alt="" className="w-full h-full object-cover" />
                                        {isCurrent && (
                                            <div className="absolute inset-0 bg-brand-600/50 flex items-center justify-center">
                                                <Play className="h-3.5 w-3.5 text-white fill-white" />
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <h4 className={`text-xs font-extrabold truncate ${isCurrent ? "text-brand-700" : "text-slate-800"}`}>
                                            {idx + 1}. {item.title}
                                        </h4>
                                        <span className="text-[10px] font-bold text-slate-400">12:56</span>
                                    </div>
                                    <div className="text-slate-400">
                                        {isCurrent ? (
                                            <div className="w-6 h-6 rounded-full bg-brand-600 text-white flex items-center justify-center shadow">
                                                <Play className="h-2.5 w-2.5 fill-white ml-0.5" />
                                            </div>
                                        ) : (
                                            <Lock className="h-3.5 w-3.5 text-slate-300" />
                                        )}
                                    </div>
                                </div>

        const file = e.target.files?.[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
            showToast("Sirf image upload karein!", "error");
            return;
        }

        setUploadingImage(true);
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const maxWidth = 700;
                const scale = Math.min(1, maxWidth / img.width);
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL("image/jpeg", 0.65);

                setNewCourse(prev => ({ ...prev, [fieldName]: data }));
                setUploadingImage(false);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

                                                value={newCourse.upiId}
                                                onChange={e => setNewCourse({ ...newCourse, upiId: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold outline-none focus:border-emerald-500"
                                                placeholder="sharma@upi"
                                            />
                                        </div>

                                        <div>
                                            <label className="text-[11px] font-bold text-slate-600 block mb-1">Payment QR Scanner</label>
                                            <div className="border border-dashed border-slate-300 rounded-2xl p-2.5 text-center bg-slate-50">
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={e => handleImageUpload(e, "upiScanner")}
                                                    className="text-[11px] w-full"
                                                />
                                                {newCourse.upiScanner && (
                                                    <img src={newCourse.upiScanner} alt="" className="w-20 h-20 object-contain rounded-xl mt-2 mx-auto border bg-white" />
                                                )}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[11px] font-bold text-slate-600 block mb-1">Helpline Mobile Number</label>
                                            <input
                                                type="tel"
                                                required
                                                maxLength="10"
                                                value={newCourse.contactNumber}
                                                onChange={e => setNewCourse({ ...newCourse, contactNumber: e.target.value.replace(/\D/g, "") })}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold outline-none focus:border-emerald-500"
                                                placeholder="9876543210"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={isSubmitting || uploadingImage}
                                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-2xl text-xs shadow-glow-green transition disabled:opacity-50"
                                        >
                                            {isSubmitting ? "Publishing..." : "Publish Course Now"}
                                        </button>
                                    </form>
                                </div>

                                {/* Active Courses List with Delete Option */}
                                <div className="lg:col-span-2 space-y-4">
                                    <h3 className="font-bubble text-base font-bold text-slate-900">Active Courses</h3>

                                    <div className="grid sm:grid-cols-2 gap-4">
                                        {courses.map(course => (
                                            <div key={course.id} className="bg-white rounded-3xl p-4 border border-slate-200 shadow-soft-card flex flex-col justify-between space-y-3">
                                                <div className="flex items-start gap-3">
                                                    <img src={course.thumbnail} alt="" className="w-20 h-20 rounded-2xl object-cover bg-slate-100 shrink-0" />
                                                    <div className="flex-1 min-w-0">
                                                        <h4 className="font-bold text-slate-900 text-sm line-clamp-2">{course.title}</h4>
                                                        <p className="text-emerald-600 font-bold text-base mt-0.5">₹{course.price}</p>
                                                        <span className="text-[10px] text-slate-400 block truncate">UPI: {course.upiId}</span>
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-2 pt-2 border-t border-slate-100">
                                                    <button
                                                        onClick={() => {
                                                            setActiveCourseId(course.id);
                                                            setContentTab("classes");
                                                            setCurrentView("teacher_course_manage");
                                                        }}
                                                        className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2 rounded-xl text-xs transition text-center"
                                                    >
                                                        Manage Content ›
                                                    </button>
                                                    <button
                                                        onClick={() => setCourseToDelete(course)}
                                                        className="p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition border border-rose-200"
                                                        title="Delete Course"
                                                    >
                                                        <Trash2 className="h-4 w-4" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}

                                        {courses.length === 0 && (
                                            <div className="col-span-full bg-white rounded-3xl p-10 text-center border-2 border-dashed border-slate-200 text-slate-400">
                                                Koi course create nahi hua hai. Left panel se naya course publish karein.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: Admission Requests */}
                        {teacherTab === "enrollments" && (
                            <div className="bg-white rounded-3xl shadow-soft-card border border-slate-200 overflow-hidden">
                                <div className="p-5 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                                    <h3 className="font-bubble text-base font-bold text-slate-900">Student Admission Requests</h3>
                                    <span className="text-xs font-bold text-slate-400">Total: {enrollments.length}</span>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-600 font-bold uppercase tracking-wider">
                                                <th className="p-4">Student Name</th>
                                                <th className="p-4">Mobile</th>
                                                <th className="p-4">Course</th>
                                                <th className="p-4">Status</th>
                                                <th className="p-4 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {enrollments.map(item => (
                                                <tr key={item.id} className="hover:bg-slate-50 transition">
                                                    <td className="p-4 font-bold text-slate-900">{item.studentName}</td>
                                                    <td className="p-4 font-mono font-semibold text-slate-600">{item.studentMobile}</td>
                                                    <td className="p-4 font-bold text-portal-blue">{item.courseName}</td>
                                                    <td className="p-4">
                                                        {item.status === "approved" ? (
                                                            <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">
                                                                Unlocked ✓
                                                            </span>
                                                        ) : (
                                                            <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">
                                                                Pending Approval
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        {item.status === "pending" ? (
                                                            <button
                                                                onClick={() => handleUnlockCourse(item.id)}
                                                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl transition shadow-sm"
                                                            >
                                                                Unlock Course
                                                            </button>
                                                        ) : (
                                                            <span className="text-slate-400 font-bold">Approved</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                            {enrollments.length === 0 && (
                                                <tr>
                                                    <td colSpan="5" className="p-10 text-center text-slate-400">
                                                        Koi payment request pending nahi hai.
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: Student Comments Moderation */}
                        {teacherTab === "comments" && (
                            <div className="bg-white rounded-3xl shadow-soft-card border border-slate-200 overflow-hidden space-y-4">
                                <div className="p-5 border-b border-slate-100 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <h3 className="font-bubble text-base font-bold text-slate-900">Live Doubts Moderation</h3>
                                        <p className="text-xs text-slate-500">Kisi bhi inappropriate comment ko turant delete karein.</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-slate-600">Course Filter:</span>
                                        <select
                                            value={selectedCourseForCommentFilter}
                                            onChange={e => setSelectedCourseForCommentFilter(e.target.value)}
                                            className="bg-white border border-slate-200 rounded-xl py-1.5 px-3 text-xs font-bold text-slate-700 outline-none"
                                        >
                                            <option value="all">Sabhi Courses ({comments.length})</option>
                                            {courses.map(c => (
                                                <option key={c.id} value={c.id}>{c.title}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="p-5">
                                    <div className="space-y-3 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                                        {comments
                                            .filter(c => selectedCourseForCommentFilter === "all" || c.courseId === selectedCourseForCommentFilter)
                                            .slice().reverse()
                                            .map(comment => (
                                                <div
                                                    key={comment.id}
                                                    className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-3"
                                                >
                                                    <div className="space-y-1 flex-1 min-w-0">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-[10px] font-bold bg-slate-200 text-slate-800 px-2 py-0.5 rounded-full">
                                                                👤 {comment.studentName || "Student"}
                                                            </span>
                                                        </div>
                                                        <p className="text-xs font-semibold text-slate-800 break-words">
                                                            "{comment.text}"
                                                        </p>
                                                    </div>
                                                    <button
                                                        onClick={() => handleDeleteComment(comment.id)}
                                                        className="p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition border border-rose-200 shrink-0"
                                                        title="Delete Comment"
                                                    >
                                                        <Trash2 className="h-4 w-4" />
                                                    </button>
                                                </div>
                                            ))}

                                        {comments.filter(c => selectedCourseForCommentFilter === "all" || c.courseId === selectedCourseForCommentFilter).length === 0 && (
                                            <div className="text-center py-12 text-slate-400">
                                                <p className="text-xs font-bold">Koi student comments nahi mile.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Confirmation Modal for Course Deletion */}
                        {courseToDelete && (
                            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                                <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4 text-center">
                                    <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
                                        <Trash2 className="h-6 w-6" />
                                    </div>
                                    <div>
                                        <h3 className="font-bubble text-lg font-bold text-slate-900">Course Delete Karein?</h3>
                                        <p className="text-xs text-slate-500 font-medium mt-1">
                                            Kya aap sach me course <strong className="text-slate-800">"{courseToDelete.title}"</strong> ko delete karna chahte hain?
                                        </p>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setCourseToDelete(null)}
                                            className="flex-1 py-2.5 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-50 transition"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="button"
                                            disabled={isSubmitting}
                                            onClick={() => handleDeleteCourse(courseToDelete.id)}
                                            className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-md transition disabled:opacity-50"
                                        >
                                            {isSubmitting ? "Deleting..." : "Haan, Delete"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                )}

                {/* =================================================
                   VIEW 11: TEACHER CONTENT MANAGER
                ================================================= */}
                {currentView === "teacher_course_manage" && (
                    (() => {
                        const course = courses.find(c => c.id === activeCourseId);
                        if (!course) return null;

                        return (
                            <div className="max-w-6xl mx-auto w-full space-y-6 animate-fade-in">
                                <button
                                    onClick={() => {
                                        setActiveCourseId(null);
                                        setCurrentView("teacher_dashboard");
                                    }}
                                    className="flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-slate-800"
                                >
                                    <ArrowLeft className="h-4 w-4" />
                                    <span>Wapas Dashboard</span>
                                </button>

                                <div className="bg-slate-900 text-white rounded-3xl p-6 flex items-center gap-4">
                                    <img src={course.thumbnail} alt="" className="w-16 h-16 rounded-2xl object-cover border" />
                                    <div>
                                        <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Content Manager</span>
                                        <h2 className="font-bubble text-xl font-bold">{course.title}</h2>
                                    </div>
                                </div>

                                <div className="grid lg:grid-cols-3 gap-6">
                                    {/* Upload Form */}
                                    <div className="lg:col-span-1 bg-white rounded-3xl p-6 border border-slate-200 shadow-soft-card space-y-3.5">
                                        <h3 className="font-bubble text-sm font-bold text-slate-900 border-b pb-2">Add Content</h3>

                                        <form onSubmit={handleAddContent} className="space-y-3">
                                            <div>
                                                <label className="text-[11px] font-bold text-slate-600 block mb-1">Content Type</label>
                                                <select
                                                    value={newContent.type}
                                                    onChange={e => setNewContent({ ...newContent, type: e.target.value })}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-bold text-slate-700 outline-none"
                                                >
                                                    <option value="class">Recorded Video Class (YouTube)</option>
                                                    <option value="live">🔴 Live Stream (YouTube)</option>
                                                    <option value="note">PDF Note Link</option>
                                                    <option value="schedule">Live Class Schedule</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="text-[11px] font-bold text-slate-600 block mb-1">Subject</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={newContent.subject}
                                                    onChange={e => setNewContent({ ...newContent, subject: e.target.value })}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold outline-none"
                                                    placeholder="e.g. Science / Math"
                                                />
                                            </div>

                                            <div>
                                                <label className="text-[11px] font-bold text-slate-600 block mb-1">Lesson Topic / Title</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={newContent.title}
                                                    onChange={e => setNewContent({ ...newContent, title: e.target.value })}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold outline-none"
                                                    placeholder="Chapter 1: Shubh Udghatan"
                                                />
                                            </div>

                                            {(newContent.type === "class" || newContent.type === "live" || newContent.type === "note") && (
                                                <div>
                                                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Link (YouTube URL / PDF)</label>
                                                    <input
                                                        type="url"
                                                        required
                                                        value={newContent.link}
                                                        onChange={e => setNewContent({ ...newContent, link: e.target.value })}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold outline-none"
                                                        placeholder="https://youtube.com/..."
                                                    />
                                                </div>
                                            )}

                                            {newContent.type === "schedule" && (
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div>
                                                        <label className="text-[11px] font-bold text-slate-600 block mb-1">Date</label>
                                                        <input
                                                            type="date"
                                                            required
                                                            value={newContent.date}
                                                            onChange={e => setNewContent({ ...newContent, date: e.target.value })}
                                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold outline-none"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="text-[11px] font-bold text-slate-600 block mb-1">Time</label>
                                                        <input
                                                            type="time"
                                                            required
                                                            value={newContent.time}
                                                            onChange={e => setNewContent({ ...newContent, time: e.target.value })}
                                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-semibold outline-none"
                                                        />
                                                    </div>
                                                </div>
                                            )}

                                            <button
                                                type="submit"
                                                disabled={isSubmitting}
                                                className="w-full bg-portal-blue hover:bg-portal-darkblue text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm mt-2 disabled:opacity-50"
                                            >
                                                {isSubmitting ? "Saving..." : "Save & Upload"}
                                            </button>
                                        </form>
                                    </div>

                                    {/* Uploaded Content List */}
                                    <div className="lg:col-span-2 bg-white rounded-3xl p-6 border border-slate-200 shadow-soft-card">
                                        <h3 className="font-bubble text-sm font-bold text-slate-900 mb-4 border-b pb-2">Uploaded Lectures</h3>

                                        <div className="divide-y divide-slate-100 max-h-[450px] overflow-y-auto custom-scrollbar">
                                            {filteredContents.map(item => (
                                                <div key={item.id} className="py-3 flex items-center justify-between gap-3">
                                                    <div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-[10px] font-bold uppercase bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                                                                {item.type}
                                                            </span>
                                                            <span className="text-xs font-bold text-portal-blue">{item.subject}</span>
                                                        </div>
                                                        <h4 className="font-bold text-sm text-slate-800 mt-1">{item.title}</h4>
                                                    </div>

                                                    <button
                                                        onClick={() => handleDeleteContent(item.id)}
                                                        className="p-2 text-slate-400 hover:text-rose-600 rounded-xl transition"
                                                        title="Delete Content"
                                                    >
                                                        <Trash2 className="h-4 w-4" />
                                                    </button>
                                                </div>
                                            ))}

                                            {filteredContents.length === 0 && (
                                                <div className="text-center py-12 text-slate-400 text-xs font-bold">
                                                    Abhi koi lecture add nahi hua hai.
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()
                )}

            </main>

            {/* FOOTER */}
            <footer className="bg-white border-t border-slate-200/80 py-6 text-center text-xs font-bold text-slate-400 select-none">
                <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                    <span className="flex items-center gap-1.5 text-portal-blue">
                        <BookOpen className="h-4 w-4" /> Sheriya Study Zone
                    </span>
                    <span>© {new Date().getFullYear()} • Education makes a better tomorrow</span>
                </div>
            </footer>
        </div>
    );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
